<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Gloock"; src: url("fonts/Gloock-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Great Vibes"; src: url("fonts/GreatVibes-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #141210; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #141210; }
      .clip { position: absolute; inset: 0; }
      #wall { background: radial-gradient(ellipse 66% 50% at 50% 47%, #d9a35a 0%, #a8763a 38%, #3a2c1e 72%, #141210 100%); }
      #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 70px; }
      #sign { display: flex; flex-direction: column; align-items: center; }
      .rey { font-family: "Gloock", serif; color: #1a1714; font-size: 250px; line-height: 0.9; letter-spacing: 6px; }
      .de-row { display: flex; align-items: center; gap: 30px; margin: 22px 0 8px; }
      .de-row i { display: block; width: 190px; height: 12px; background: #1a1714; }
      .de { font-family: "Gloock", serif; color: #1a1714; font-size: 92px; line-height: 1; }
      .alis { font-family: "Gloock", serif; color: #1a1714; font-size: 150px; line-height: 1; letter-spacing: 4px; }
      .cuba { font-family: "Great Vibes", cursive; color: #1a1714; font-size: 150px; line-height: 1; margin-top: 4px; }
      #tagline { font-family: "Instrument Sans", sans-serif; color: #E0C79B; font-size: 42px; letter-spacing: 2px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="wall" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <section id="stage" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div id="sign">
          <svg id="crown" viewBox="0 0 300 150" width="360" aria-label="Corona">
            <path d="M20 120 L10 30 L80 80 L150 10 L220 80 L290 30 L280 120 Z" fill="#1a1714" />
            <rect x="20" y="124" width="260" height="20" fill="#1a1714" />
            <path d="M130 92 L150 70 L170 92 L150 114 Z" fill="#E0A957" />
            <path d="M70 100 L84 86 L98 100 L84 114 Z" fill="#E0A957" />
            <path d="M202 100 L216 86 L230 100 L216 114 Z" fill="#E0A957" />
          </svg>
          <div class="rey" id="w-rey">REY</div>
          <div class="de-row" id="w-de"><i></i><div class="de">DE</div><i></i></div>
          <div class="alis" id="w-alis">ALISADOS</div>
          <div class="cuba" id="w-cuba">en cuba</div>
        </div>
        <p id="tagline">Alisados sin formol · La Habana y Estados Unidos</p>
      </section>
      <audio id="voz" src="assets/voz-intro.mp3" data-start="2.4" data-duration="4.23" data-track-index="2" data-volume="1"></audio>
      <audio id="musica" src="assets/musica.mp3" data-start="0" data-duration="8" data-track-index="3" data-volume="0.32"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const off = "drop-shadow(0 0 0px rgba(255,196,102,0)) drop-shadow(0 0 0px rgba(255,170,60,0))";
      const on = "drop-shadow(0 0 20px rgba(255,196,102,0.9)) drop-shadow(0 0 56px rgba(255,170,60,0.5))";
      tl.fromTo("#sign", { opacity: 0.25, filter: off }, { opacity: 1, filter: on, duration: 0.25, ease: "none" }, 0.4);
      tl.to("#sign", { opacity: 0.4, filter: off, duration: 0.12, ease: "none" }, 0.7);
      tl.to("#sign", { opacity: 1, filter: on, duration: 0.9, ease: "power2.out" }, 0.95);
      tl.fromTo(["#crown", "#w-rey", "#w-de", "#w-alis", "#w-cuba"], { y: 16 }, { y: 0, duration: 0.9, ease: "power3.out", stagger: 0.08 }, 0.95);
      tl.fromTo("#tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 3.2);
      tl.to("#sign", { scale: 1.03, duration: 3.6, ease: "sine.inOut", transformOrigin: "50% 50%" }, 4.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
