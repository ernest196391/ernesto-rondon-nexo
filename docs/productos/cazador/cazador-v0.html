:root{
  --nexo-amarillo: #FFC21A;

  --surface-raised: #FFFFFF;
  --surface-sunken: #F3F3F2;
  --ink: #121212;

  --line-strong: #8A8A86;
  --brand: var(--nexo-amarillo);
  --on-brand: var(--nexo-tinta);
  --brand-surface: #FFF3CC;
  --on-brand-surface: #121212;
  --accent: #0B5F8A;
  --on-accent: #FFFFFF;
  --accent-surface: #E3F1F9;
  --success: #1A7438;
  --success-surface: #E4F4E8;
  --warning: #A84A05;
  --warning-surface: #FDEBDD;
  --danger: #B42318;
  --danger-surface: #FCE6E4;

  --merchant: var(--brand);
  --on-merchant: var(--on-brand);

  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;

  --space-8: 32px;

  --space-16: 64px;

}

  --surface-sunken: #0A0A0A;

  --line-strong: #6E6E6A;

  --on-brand: var(--nexo-tinta);
  --brand-surface: #3A2E08;
  --on-brand-surface: #FFE08A;
  --accent: #6EBEEB;
  --on-accent: #06202E;
  --accent-surface: #0D2A3A;
  --success: #5CCB80;
  --success-surface: #0F2E19;
  --warning: #FF9E57;
  --warning-surface: #3A1F0A;
  --danger: #FF7C70;
  --danger-surface: #3D1311;
  --focus: #6EBEEB;

  --nexo-blanco: #FFFFFF;
  --surface: #141414;
  --surface-raised: #1F1F1F;
  --surface-sunken: #0A0A0A;
  --ink: #F3F3F2;
  --ink-muted: #B4B4B0;
  --ink-subtle: #8F8F8B;
  --line: #2C2C2C;
  --line-strong: #6E6E6A;
  --brand: var(--nexo-amarillo);
  --on-brand: var(--nexo-tinta);
  --brand-surface: #3A2E08;
  --on-brand-surface: #FFE08A;
  --accent: #6EBEEB;
  --on-accent: #06202E;
  --accent-surface: #0D2A3A;
  --success: #5CCB80;
  --success-surface: #0F2E19;
  --warning: #FF9E57;
  --warning-surface: #3A1F0A;
  --danger: #FF7C70;
  --danger-surface: #3D1311;
  --focus: #6EBEEB;
  --merchant: var(--brand);
  --on-merchant: var(--on-brand);
}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-800.woff2") format("woff2");font-weight:800;font-display:swap}
.display-lg{font-family:var(--font-sans);font-size:48px;line-height:52px;font-weight:800;letter-spacing:-0.02em}
.display{font-family:var(--font-sans);font-size:32px;line-height:36px;font-weight:800;letter-spacing:-0.02em}
.title-lg{font-family:var(--font-sans);font-size:24px;line-height:30px;font-weight:700;letter-spacing:-0.01em}
.title{font-family:var(--font-sans);font-size:20px;line-height:26px;font-weight:700}
.amount{font-family:var(--font-sans);font-size:28px;line-height:32px;font-weight:800;letter-spacing:-0.01em}
.body-lg{font-family:var(--font-sans);font-size:18px;line-height:26px;font-weight:400}
.body{font-family:var(--font-sans);font-size:16px;line-height:24px;font-weight:400}
.body-strong{font-family:var(--font-sans);font-size:16px;line-height:24px;font-weight:600}
.button{font-family:var(--font-sans);font-size:16px;line-height:20px;font-weight:600}
.small{font-family:var(--font-sans);font-size:14px;line-height:20px;font-weight:400}
.label{font-family:var(--font-sans);font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.04em}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/24px var(--font-sans)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:var(--size-focus) solid var(--focus);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink)}
.logo{height:24px;width:auto;display:block}
.label{font:600 13px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;font:600 16px/20px var(--font-sans);color:var(--ink-muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.screen{display:flex;flex-direction:column;flex:1}
.pad{padding:20px 16px 0;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font:700 24px/30px var(--font-sans);letter-spacing:-.01em}
h2{margin:0;font:700 20px/26px var(--font-sans)}
p{margin:0}
.muted{color:var(--ink-muted)}
.small{font:400 14px/20px var(--font-sans)}
.strong{font-weight:600}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-xs);font:600 13px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;align-self:flex-start}
.badge svg{width:16px;height:16px}
.b-info{background:var(--accent-surface);color:var(--accent)}
.b-warning{background:var(--warning-surface);color:var(--warning)}
.b-success{background:var(--success-surface);color:var(--success)}
.b-danger{background:var(--danger-surface);color:var(--danger)}
.b-neutral{background:var(--surface-sunken);color:var(--ink-muted)}
.goal{margin:16px 16px 0;padding:14px 16px;background:var(--surface-sunken);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.bar.soft>i{background:var(--line-strong)}
.chips{padding:16px 16px 0;display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:var(--radius-sm);font:600 15px/20px var(--font-sans);cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-raised)}
.card.done{opacity:.72}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.score{flex:none;min-width:52px;height:52px;border-radius:var(--radius-sm);background:var(--brand-surface);color:var(--on-brand-surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.score b{font:800 20px/22px var(--font-sans);font-variant-numeric:tabular-nums}
.score span{font:600 11px/14px var(--font-sans)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tel{font-variant-numeric:tabular-nums}
.link{min-height:48px;display:inline-flex;align-items:center;gap:6px;font:600 16px/20px var(--font-sans);color:var(--accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.link svg{width:20px;height:20px}
.empty{padding:24px 16px;color:var(--ink-muted)}
.foot{position:sticky;bottom:0;margin-top:auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.btn{min-height:48px;padding:0 20px;border-radius:var(--radius-sm);border:1px solid transparent;display:flex;width:100%;align-items:center;justify-content:center;gap:8px;font:600 16px/20px var(--font-sans);cursor:pointer;text-decoration:none;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:var(--surface-raised);color:var(--ink);border-color:var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.center{text-align:center}
.back{padding:4px 8px;border-bottom:1px solid var(--line)}
.back .link{padding:0 8px}
.scorebox{margin:16px 16px 0;padding:16px;background:var(--brand-surface);color:var(--on-brand-surface);border-radius:var(--radius-md);display:flex;gap:16px;align-items:center}
.scorebox .n{display:flex;flex-direction:column;align-items:center}
.scorebox b{font:800 32px/36px var(--font-sans);font-variant-numeric:tabular-nums}
.scorebox small{font:600 13px/16px var(--font-sans)}
.sec{padding:20px 16px 0;display:flex;flex-direction:column;gap:10px}
.why{display:flex;gap:10px;align-items:flex-start}
.why svg{width:24px;height:24px;flex:none}
.ok{color:var(--success)}
.warn{color:var(--warning)}
.check{min-height:48px;display:flex;gap:12px;align-items:center;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
textarea{width:100%;min-height:150px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised);resize:vertical;font:400 16px/24px var(--font-sans)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{min-height:40px;padding:0 12px;border-radius:var(--radius-xs);border:0;font:600 14px/18px var(--font-sans);background:var(--surface-sunken);color:var(--ink-muted);cursor:pointer}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step.drop[aria-pressed="true"]{background:var(--danger);color:var(--surface)}
.links{display:flex;gap:16px;flex-wrap:wrap}
.alert{margin:20px 16px 0;display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-md);border:1px solid}
.alert svg{width:24px;height:24px;flex:none}
.a-warning{background:var(--warning-surface);border-color:var(--warning)}.a-warning svg{color:var(--warning)}
.a-success{background:var(--success-surface);border-color:var(--success)}.a-success svg{color:var(--success)}
.a-info{background:var(--accent-surface);border-color:var(--accent)}.a-info svg{color:var(--accent)}
.stage{display:flex;flex-direction:column;gap:6px}
.stage .bar{height:10px;border-radius:5px;background:var(--surface-sunken)}
.rule{display:flex;gap:10px}
.rule svg{width:20px;height:20px;flex:none;color:var(--accent);margin-top:2px}
.credit{padding:20px 16px 24px;color:var(--ink-muted);font:400 14px/20px var(--font-sans)}
.credit a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);width:calc(100% - 32px);max-width:520px;background:var(--nexo-tinta);color:var(--nexo-blanco);padding:12px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow-sheet);font:400 16px/24px var(--font-sans);transition:opacity .18s;opacity:0;pointer-events:none;z-index:10}
.toast.show{opacity:1}
details summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

    h += '<h1>' + esc(b.name) + '</h1>';
    h += '<p class="muted">' + esc(b.kind) + ' · ' + esc(b.address || b.zone) + (b.opening_hours ? '<br>Horario en el mapa: ' + esc(b.opening_hours) : '<br>Sin horario en el mapa') + '</p>';
    h += '<p><span class="strong tel">' + esc(b.phone) + '</span> <span class="muted small">' + (b.phone_mobile ? 'celular' : 'fijo, sin WhatsApp') + '</span>' + (b.other_phones && b.other_phones.length ? '<br><span class="small muted">Otro: ' + esc(b.other_phones.join(', ')) + '</span>' : '') + '</p></div>';
    h += '<div class="scorebox"><div class="n"><b>' + b.score + '</b><small>de 100</small></div><span class="strong">' + (b.score >= 85 ? 'Buena oportunidad: le falta lo que NEXO le da.' : b.score >= 70 ? 'Oportunidad media: revisa bien antes de escribir.' : 'Oportunidad baja: deja este para el final.') + '</span></div>';
    h += '<div class="sec"><h2>Por qué</h2>';
    b.reasons.forEach(function (r) { h += '<div class="why">' + icon(r.ok ? 'bien' : 'aviso', r.ok ? 'ok' : 'warn') + '<span>' + esc(r.texto) + '</span></div>'; });
    h += '</div>';
    h += '<div class="sec" style="gap:4px"><h2 style="margin-bottom:4px">Antes de escribir</h2>';
    [['abierto', 'Sigue abierto (lo vi en el mapa o pasé por ahí)'], ['estado', 'No es un negocio del Estado'], ['telefono', 'El teléfono es del negocio']].forEach(function (k) {
      h += '<label class="check"><input type="checkbox" data-check="' + k[0] + '"' + (c[k[0]] ? ' checked' : '') + '><span>' + k[1] + '</span></label>';
    });
    h += '<div class="links"><a class="link" href="' + esc(b.maps_url) + '" target="_blank" rel="noopener">Buscar en Google Maps</a><a class="link" href="' + esc(b.osm_url) + '" target="_blank" rel="noopener">Ver en OpenStreetMap</a></div>';
    h += '</div>';
    h += '<div class="sec"><h2>Mensaje listo</h2><label class="sr" for="msg">Mensaje para ' + esc(b.name) + '</label>';
    h += '<textarea id="msg" data-msg="' + esc(id) + '">' + esc(msgOf(b)) + '</textarea>';
    h += '<button type="button" class="btn btn-secondary" data-copy="msg">Copiar mensaje</button>';
    if (it.msg) h += '<button type="button" class="link" data-reset-msg="' + esc(id) + '">Volver al mensaje original</button>';
    h += '</div>';
    h += '<div class="sec"><h2>En qué paso va</h2><div class="steps" role="group" aria-label="Paso">';
    STEPS.forEach(function (st) { h += '<button type="button" class="step" data-step="' + esc(st) + '" aria-pressed="' + (s === st) + '">' + esc(st) + '</button>'; });
    h += '</div><span class="small muted">Si no quiere seguir:</span><div class="steps" role="group" aria-label="Descartar">';
    DROPS.forEach(function (st) { h += '<button type="button" class="step drop" data-step="' + esc(st) + '" aria-pressed="' + (s === st) + '">' + esc(st) + '</button>'; });
    h += '</div>';
    if (it.writtenAt) h += '<span class="small muted">Escrita el ' + esc(new Date(it.writtenAt.slice(0, 10) + 'T12:00:00').toLocaleDateString('es')) + '. Si no contesta, vuelve a escribir en 2 o 3 días (máximo 3 veces).</span>';
    h += '</div>';
    h += '<div class="foot">';
    if (isDrop(s)) {
      h += '<button type="button" class="btn btn-primary" disabled>' + icon('cerrar') + 'Descartada: no se escribe</button>';
    } else if (!ready) {
      h += '<button type="button" class="btn btn-primary" disabled>' + icon('mensaje') + (b.phone_mobile ? 'Escribir por WhatsApp' : 'Llamar al negocio') + '</button>';
      h += '<span class="small muted center">Marca las 3 comprobaciones para poder escribir.</span>';
    } else if (b.phone_mobile) {
      h += '<a class="btn btn-primary" data-wa="' + esc(id) + '" href="' + esc(waUrl(b)) + '" target="_blank" rel="noopener">' + icon('mensaje') + 'Escribir por WhatsApp</a>';
      h += '<span class="small muted center">Se abre WhatsApp con el mensaje. Tú lo mandas.</span>';
    } else {
      h += '<a class="btn btn-primary" data-call="' + esc(id) + '" href="tel:' + esc(b.phone_e164) + '">Llamar al negocio</a>';
      h += '<span class="small muted center">Es un fijo. Pide un número de WhatsApp para mandarle la idea.</span>';
    }
    h += '</div>';
    return h;
  }

  // ---------- pantalla 3: cómo vamos ----------
  function funnel() {
    var f = { fichas: ALL.length, revisadas: 0, escritas: 0, respondieron: 0, demos: 0, pagando: 0, descartadas: 0 };
    ALL.forEach(function (b) {
      var it = STATE.items[b.id]; if (!it) return;
      var m = it.max || 0;
      if (m >= 1) f.revisadas++;
      if (m >= 2) f.escritas++;
      if (m >= 3) f.respondieron++;
      if (m >= 4) f.demos++;
      if (m >= 5) f.pagando++;
      if (isDrop(it.status)) f.descartadas++;
    });
    return f;
  }
  function trialDay() {
    var first = null;
    Object.keys(STATE.items).forEach(function (id) { var w = STATE.items[id].writtenAt; if (w && (!first || w < first)) first = w; });
    if (!first) return 0;
    var a = new Date(first.slice(0, 10) + 'T00:00:00'), b = new Date(today() + 'T00:00:00');
    return Math.floor((b - a) / 86400000) + 1;
  }
  function renderEmbudo() {
    var f = funnel(), day = trialDay();
    function stage(label, v, goal, max, strong) {
      return '<div class="stage"><div class="row"><span class="strong">' + label + '</span><span class="strong tel">' + v + (goal ? '<span class="small muted" style="font-weight:400">' + goal + '</span>' : '') + '</span></div>' +
        '<div class="bar' + (strong ? '' : ' soft') + '"><i style="width:' + Math.round(Math.min(1, max ? v / max : 0) * 100) + '%"></i></div></div>';
    }
    var h = '<div class="pad"><h1>Cómo vamos</h1><p class="muted">' + (day ? 'Prueba de 2 semanas. Vamos por el día ' + day + '.' : 'Prueba de 2 semanas. Empieza el día que mandes el primer mensaje.') + ' Meta: ' + GOAL_WRITTEN + ' escritos y ' + GOAL_DEMOS + ' demos.</p></div>';
    h += '<div class="sec" style="gap:14px">';
    h += stage('Fichas', f.fichas, ' de ' + ALL.length, ALL.length, false);
    h += stage('Revisadas', f.revisadas, '', ALL.length, false);
    h += stage('Escritas', f.escritas, ' · meta ' + GOAL_WRITTEN, GOAL_WRITTEN, true);
    h += stage('Respondieron', f.respondieron, '', Math.max(f.escritas, 1), false);
    h += stage('Demos', f.demos, ' · meta ' + GOAL_DEMOS, GOAL_DEMOS, true);
    h += stage('Pagando', f.pagando, '', GOAL_DEMOS, false);
    h += '<span class="small muted">Descartadas: ' + f.descartadas + '</span></div>';
    var falta = Math.max(0, GOAL_WRITTEN - f.escritas);
    if (falta > 0) h += '<div class="alert a-warning" role="status">' + icon('aviso') + '<div><div class="strong">Te faltan ' + falta + ' contactos para la meta</div><div>Escribe a ' + GOAL_DAY + ' al día y llegas en ' + Math.ceil(falta / GOAL_DAY) + (Math.ceil(falta / GOAL_DAY) === 1 ? ' día.' : ' días.') + '</div></div></div>';
    else h += '<div class="alert a-success" role="status">' + icon('bien') + '<div><div class="strong">Meta de contactos cumplida</div><div>Ahora toca conseguir ' + GOAL_DEMOS + ' demos.</div></div></div>';
    h += '<div class="sec"><h2>Reglas para cuidar tu número</h2>';
    ['Máximo 10 mensajes al día, desde tu teléfono.', 'Cada mensaje distinto: con el nombre del negocio.', 'Si dicen que no, se marca y no se vuelve a escribir.', 'Nunca a negocios del Estado.'].forEach(function (r) {
      h += '<div class="rule">' + icon('info') + '<span>' + r + '</span></div>';
    });
    h += '</div>';
    h += '<div class="sec"><details><summary>Copiar el seguimiento (para guardarlo)</summary><p class="small muted">Tu avance vive solo en este teléfono. Cópialo de vez en cuando y guárdalo en tu chat «Tú».</p>';
    h += '<button type="button" class="btn btn-secondary" data-copy="track" style="margin-top:8px">Copiar seguimiento</button></details></div>';
    var resp = ALL.filter(function (b) { return statusOf(b.id) === 'Respondió'; })[0];
    var next = nextPending();
    h += '<div class="foot"><span class="small muted">Siguiente paso</span>';
    if (resp) {
      h += '<span class="strong">' + esc(resp.name) + ' respondió. Prepárale su demo.</span>';
      h += '<a class="btn btn-primary" href="#ficha/' + encodeURIComponent(resp.id) + '">' + icon('siguiente') + 'Abrir su ficha</a>';
    } else if (next) {
      h += '<span class="strong">' + esc(next.name) + ' (' + next.score + ' de 100) es el siguiente.</span>';
      h += '<a class="btn btn-primary" href="#ficha/' + encodeURIComponent(next.id) + '">' + icon('mensaje') + 'Siguiente por escribir</a>';
    } else {
      h += '<span class="strong">Ya escribiste a todos. Espera respuestas.</span>';
    }
    h += '</div>';
    return h;
  }
  function trackingCSV() {
    var rows = [['id', 'nombre', 'nicho', 'telefono', 'estado', 'escrita', 'revisada_abierto', 'revisada_no_estado', 'revisada_telefono'].join(',')];
    ALL.forEach(function (b) {
      var it = STATE.items[b.id] || { checks: {} }; var c = it.checks || {};
      rows.push([b.id, b.name, b.niche_label, b.phone, it.status || 'Nueva', it.writtenAt ? it.writtenAt.slice(0, 10) : '', c.abierto ? 'sí' : '', c.estado ? 'sí' : '', c.telefono ? 'sí' : ''].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','));
    });
    return rows.join('\n');
  }

  // ---------- rutas ----------
  // La ruta vive en memoria (dentro de un Artifact el #hash puede no funcionar); el #hash es solo un extra.
  var ROUTE = '#lista';
  try { if (/^#(lista|embudo|ficha\/.+)$/.test(location.hash)) ROUTE = location.hash; } catch (e) { }
  function currentId() { return ROUTE.indexOf('#ficha/') === 0 ? decodeURIComponent(ROUTE.slice(7)) : null; }
  function go(r) {
    ROUTE = r; route(); window.scrollTo(0, 0);
    try { history.replaceState(null, '', r); } catch (e) { }
  }
  function route() {
    var hash = ROUTE;
    var main = document.getElementById('main');
    var tab = '#lista';
    if (hash.indexOf('#ficha/') === 0) { main.innerHTML = renderFicha(decodeURIComponent(hash.slice(7))); tab = ''; }
    else if (hash === '#embudo') { main.innerHTML = renderEmbudo(); tab = '#embudo'; }
    else { main.innerHTML = renderLista(); }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      if (t.getAttribute('data-go') === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  }
  function rerender(keepScroll) {
    var y = window.scrollY; route(); if (keepScroll) window.scrollTo(0, y);
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, a');
    if (!t) return;
    if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
    var href = t.tagName === 'A' ? t.getAttribute('href') || '' : '';
    if (href.charAt(0) === '#') { ev.preventDefault(); go(href); return; }
    if (t.hasAttribute('data-niche')) { STATE.ui.niche = t.getAttribute('data-niche'); save(); rerender(true); return; }
    if (t.hasAttribute('data-view')) { STATE.ui.view = t.getAttribute('data-view'); save(); rerender(true); return; }
    var id = currentId();
    if (t.hasAttribute('data-step') && id) {
      setStatus(id, t.getAttribute('data-step')); rerender(true); toast('Paso guardado: ' + t.getAttribute('data-step') + '.'); return;
    }
    if (t.hasAttribute('data-copy')) {
      if (t.getAttribute('data-copy') === 'msg') { var ta = document.getElementById('msg'); copy(ta ? ta.value : ''); }
      else copy(trackingCSV());
      return;
    }
    if (t.hasAttribute('data-reset-msg') && id) { item(id).msg = null; save(); rerender(true); return; }
    if (t.hasAttribute('data-wa') || t.hasAttribute('data-call')) {
      var wid = t.getAttribute('data-wa') || t.getAttribute('data-call');
      if (rank(statusOf(wid)) < 2) {
        setStatus(wid, 'Escrita');
        setTimeout(function () { rerender(true); toast('Marcada como escrita. Si al final no la mandaste, toca «Revisada».'); }, 300);
      }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-check')) {
      var id = currentId();
      var it = item(id);
      it.checks = it.checks || {};
      it.checks[t.getAttribute('data-check')] = t.checked;
      if (checksDone(id) && statusOf(id) === 'Nueva') { it.status = 'Revisada'; it.max = Math.max(it.max || 0, 1); }
      save(); rerender(true);
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-msg')) {
      var id = t.getAttribute('data-msg'), b = BY_ID[id];
      item(id).msg = t.value === b.message ? null : t.value; save();
      var a = document.querySelector('[data-wa]'); if (a) a.setAttribute('href', waUrl(b));
    }
  });
  route();
})();
</script>
</body>
