<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi catálogo · propuesta</title>
<style>
:root{
  --verde:#173e35;--crema:#f6f2e9;--crema2:#F6F1E6;--claro:#e4eee8;--oro:#c99a1e;
  --blanco:#fff;--gris:#5f6361;--gris2:#8b8f8d;--linea:#d9d8d4;--fondo:#e9e9e7;
  --f:"Helvetica Neue",Helvetica,Arial,sans-serif;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:16px/1.4 var(--f);color:var(--verde);background:var(--fondo);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}

/* Marco de escritorio: en el móvil la propuesta ocupa toda la pantalla */
.intro{max-width:390px;margin:0 auto;padding:18px 4px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--gris)}
.intro b{color:var(--verde);margin-right:auto}
.intro button{border:1px solid var(--linea);background:var(--blanco);border-radius:99px;padding:6px 10px;font-size:13px}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 90px));min-height:640px;margin:0 auto 24px;background:var(--crema);border-radius:32px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.16);border:1px solid #cfcfcb}
@media (max-width:440px){
  .intro{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;margin:0;border:0;box-shadow:none}
}

/* Pantallas */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--crema);animation:in .18s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{display:flex;align-items:center;gap:4px;min-height:56px;padding:env(safe-area-inset-top) 6px 0 16px}
.top.green{background:var(--verde);color:var(--crema2)}
.top.light{padding-left:4px;background:var(--crema)}
.top .logo{height:19px;width:auto;margin-right:auto}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.icon:active{background:rgba(23,62,53,.08)}
.top.green .icon:active{background:rgba(255,255,255,.12)}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.ttl b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}

/* Lista */
.searchbar{padding:12px 16px 4px;background:var(--crema)}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;background:var(--blanco);border:1px solid var(--linea);border-radius:12px;color:var(--gris)}
.search input{flex:1;border:0;outline:0;background:none;color:var(--verde);min-width:0;font-size:16px}
.filters{display:flex;gap:8px;padding:8px 16px 4px}
.fchip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--linea);background:var(--blanco);font-size:14px}
.fchip[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:var(--blanco)}
.list{list-style:none;display:flex;flex-direction:column;gap:8px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 8px 10px 10px;background:var(--blanco);border-radius:var(--r);text-align:left;min-height:72px}
.row:active{background:var(--claro)}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--crema);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:contain}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rt b{font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt small{font-size:13px;color:var(--gris);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gris2);display:inline-block}
.dot.pub{background:var(--verde)}
.row .ic{color:var(--gris2)}
.more{display:block;margin:14px auto 0;height:44px;padding:0 18px;color:var(--verde);font-weight:600;font-size:15px}
.empty{padding:40px 16px;text-align:center;color:var(--gris)}
.fab{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 22px 0 18px;border-radius:99px;background:var(--verde);color:var(--blanco);display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 6px 18px rgba(23,62,53,.3)}

/* Producto */
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--claro);color:var(--verde);white-space:nowrap;flex:none}
.pill.draft{background:#ebebe8;color:var(--gris)}
.tabs{display:flex;border-bottom:1px solid var(--linea);background:var(--crema);padding:0 8px}
.tab{flex:1;height:46px;font-size:15px;font-weight:600;color:var(--gris);border-bottom:2.5px solid transparent;position:relative}
.tab[aria-selected=true]{color:var(--verde);border-bottom-color:var(--verde)}
.tab:disabled{color:#b4b6b5}
.tab .badge{position:absolute;top:10px;margin-left:4px;width:8px;height:8px;border-radius:50%;background:var(--oro)}
.photo{position:relative;background:var(--blanco);border-radius:var(--r);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.photo .art{width:88%}
.photo img{width:100%;height:100%;object-fit:contain}
.on-photo{position:absolute;right:10px;bottom:10px;height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.94);border:1px solid var(--linea);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.addphoto{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--linea);border-radius:var(--r);color:var(--gris);font-weight:600;background:var(--blanco)}
.addphoto .ic{width:30px;height:30px}
.field{margin-top:20px}
.lab{display:flex;align-items:center;justify-content:space-between;min-height:32px;margin-bottom:6px}
.lab label,.lab span{font-size:13px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
.lab small{font-size:13px;color:var(--gris)}
.inp{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--linea);border-radius:12px;background:var(--blanco);font-size:16px;color:var(--verde);resize:none;line-height:1.45}
.inp:focus{outline:0;border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
textarea.inp{display:block}
.mini{height:32px;padding:0 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--verde);background:var(--claro)}
.mini:disabled{opacity:.5}
.tools{display:flex;gap:6px;margin-bottom:6px}
.tool{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--linea);background:var(--blanco);font-size:14px}
.kv{display:flex;align-items:center;gap:8px;margin-top:20px;padding:12px 14px;background:var(--blanco);border-radius:12px}
.kv span{font-size:13px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
.kv b{margin-left:auto;font-size:16px}
.kv .ic{color:var(--gris2)}
.sugg{margin-top:8px;padding:12px 14px;border-radius:12px;background:var(--claro);font-size:15px;white-space:pre-line}
.sugg .acts{display:flex;gap:8px;margin-top:10px}
.feat{display:grid;grid-template-columns:28px 1fr 36px;grid-template-areas:"n f x" ". b b";column-gap:8px;row-gap:6px;align-items:center;padding:10px 4px 10px 10px;background:var(--blanco);border-radius:12px;margin-bottom:8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--verde);color:var(--blanco);display:grid;place-items:center;font-size:13px;font-weight:700}
.feat .num{grid-area:n}.feat .inp[data-k=f]{grid-area:f}.feat .inp[data-k=b]{grid-area:b;margin-right:6px}.feat .icon{grid-area:x}
.feat .inp{min-height:44px;padding:10px 12px;font-size:15px}
.feat .inp[data-k=b]{color:var(--gris)}
.feat .icon{width:36px;height:44px;color:var(--gris2)}
.addline{width:100%;height:48px;border:1.5px dashed var(--linea);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;color:var(--verde);font-size:15px}
.rev{padding:12px 14px;background:var(--blanco);border-radius:12px;margin-bottom:8px}
.rev .st{color:var(--oro);letter-spacing:2px;font-size:15px}
.rev q{display:block;margin:4px 0;font-size:15px}
.rev small{color:var(--gris);font-size:13px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--crema);color:var(--gris);margin-left:6px}

/* Barra de acción fija */
.bar{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--crema);border-top:1px solid var(--linea)}
.btn{flex:1;min-height:52px;padding:0 16px;border-radius:14px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15}
.btn.p{background:var(--verde);color:var(--blanco)}
.btn.o{background:var(--blanco);color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{background:#d7d8d5;color:#5f6361;border-color:#d7d8d5}
.btn.done:disabled{background:var(--claro);border-color:var(--claro);color:var(--verde)}
.hintchip{font-size:14px;font-weight:700;background:var(--verde);color:var(--blanco);padding:8px 14px;border-radius:99px}
.btn:has(small){flex-direction:column;gap:1px}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.9}
.btn.sm{flex:none;min-height:40px;font-size:14px;border-radius:12px;padding:0 14px}
.btn.grow1{flex:0 0 38%}

/* Anuncio */
.stage{background:#ebe9e3;margin:-16px -16px 0;padding:18px 0 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.adwrap{container-type:inline-size;width:228px;box-shadow:0 6px 22px rgba(0,0,0,.14)}
.adwrap.sq{width:300px}
.seg{display:inline-flex;background:var(--blanco);border-radius:12px;padding:3px;border:1px solid var(--linea)}
.seg button{height:38px;padding:0 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--gris)}
.seg button[aria-checked=true]{background:var(--verde);color:var(--blanco)}
.sec{font-size:13px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.tpl{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;font-size:12.5px;font-weight:600;color:var(--gris);text-align:center;line-height:1.15}
.tpl .mini-ad{width:56px;height:88px;border-radius:8px;background:var(--crema);border:1.5px solid var(--linea);display:grid;place-items:center;overflow:hidden}
.tpl[aria-checked=true]{color:var(--verde)}
.tpl[aria-checked=true] .mini-ad{border:2.5px solid var(--verde)}
.opt{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--gris);position:relative;scroll-snap-align:start}
.opt .pic{width:76px;height:76px;border-radius:12px;border:1.5px solid var(--linea);overflow:hidden;display:grid;place-items:center;background:var(--blanco);position:relative}
.opt .pic .art{width:88%}
.opt .pic img{width:100%;height:100%;object-fit:cover}
.opt[aria-checked=true]{color:var(--verde)}
.opt[aria-checked=true] .pic{border:2.5px solid var(--verde)}
.opt .flag{position:absolute;top:4px;left:4px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;background:var(--oro);color:var(--blanco);text-transform:uppercase;letter-spacing:.03em}
.opt .dots{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;border:1px solid var(--linea)}
.opt.add .pic{border-style:dashed;background:var(--crema);color:var(--verde)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--claro);border-top-color:var(--verde);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:#f3ead2;border-radius:12px;font-size:14px;font-weight:600}
.note span{flex:1}
.points{display:flex;flex-direction:column;gap:6px}
.pt{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;background:var(--blanco);border:1.5px solid var(--linea);border-radius:12px;text-align:left;font-size:15px}
.pt[aria-pressed=true]{border:2px solid var(--verde);background:var(--claro)}
.pt .num{margin:0}
.pt em{margin-left:auto;font-style:normal;font-size:13px;color:var(--gris);white-space:nowrap}
.linkbtn{color:var(--verde);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;height:32px}
.rpick{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;background:var(--blanco);border:1.5px solid var(--linea);border-radius:12px;margin-bottom:8px}
.rpick[aria-checked=true]{border:2px solid var(--verde)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--gris2);flex:none;margin-top:2px;display:grid;place-items:center}
.rpick[aria-checked=true] .radio{border-color:var(--verde)}
.rpick[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--verde)}

/* Vista previa del anuncio (mismas proporciones que la imagen 1080 px) */
.ad{position:relative;aspect-ratio:9/16;background:var(--crema);padding:6cqw;display:flex;flex-direction:column;overflow:hidden;font-family:var(--f);color:var(--verde)}
.ad.sq{aspect-ratio:1/1;padding:5cqw}
.ad .brand{font-size:2.5cqw;letter-spacing:.22em;font-weight:700}
.ad .hl{font-size:6.4cqw;font-weight:700;line-height:1.12;margin-top:3cqw;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ad.sq .hl{font-size:4.8cqw;margin-top:2cqw}
.ad .body{margin-top:4cqw;display:flex;flex-direction:column;gap:4cqw;min-height:0}
.ad.sq .body.two{flex-direction:row;gap:4cqw}
.ad .box{background:#fff;height:66cqw;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.ad.sq .box{height:40cqw}
.ad.sq .two .box{height:56cqw;width:46cqw}
.ad .art{position:relative;width:100%;aspect-ratio:4/3;max-height:100%}
.ad .art svg,.ad .art img{width:100%;height:100%;object-fit:contain;display:block}
.ad .mk{position:absolute;width:5.6cqw;height:5.6cqw;margin:-2.8cqw 0 0 -2.8cqw;border-radius:50%;background:#fff;border:.6cqw solid var(--verde);font-size:2.8cqw;font-weight:700;display:grid;place-items:center;z-index:2}
.ad .fl{list-style:none;display:flex;flex-direction:column;gap:2.6cqw;flex:1;min-width:0}
.ad .fl li{display:grid;grid-template-columns:6cqw auto;justify-content:start;gap:2.4cqw;align-items:start}
.ad .fl .n{width:6cqw;height:6cqw;border-radius:50%;background:var(--verde);color:#fff;font-size:3cqw;font-weight:700;display:grid;place-items:center}
.ad .fl b{display:block;font-size:3.6cqw;line-height:1.2}
.ad .fl i{display:block;font-style:normal;font-size:3cqw;color:#4b5551;line-height:1.25;margin-top:.6cqw}
.ad.sq .fl b{font-size:3.2cqw}.ad.sq .fl i{font-size:2.7cqw}
.ad .sp{list-style:none;display:flex;flex-direction:column;gap:2cqw;font-size:3.8cqw;font-weight:600}
.ad.sq .sp{font-size:3.2cqw}
.ad .price{font-size:10cqw;font-weight:800;line-height:1}
.ad.sq .price{font-size:7cqw}
.ad .price s{font-size:4.6cqw;font-weight:400;color:#6b6b6b;margin-left:2cqw}
.ad .band{background:var(--claro);padding:2.6cqw 3cqw;font-size:3.6cqw;font-weight:600;margin-top:2.6cqw}
.ad.sq .band{font-size:3cqw;padding:2cqw 2.6cqw}
.ad .use{font-size:4.4cqw;font-weight:600;line-height:1.25}
.ad.sq .use{font-size:3.4cqw}
.ad .q{display:flex;flex-direction:column;gap:2cqw;min-width:0;flex:1}
.ad .q .mark{font-size:14cqw;line-height:.6;font-weight:700;height:7cqw}
.ad .q p{font-size:4.2cqw;line-height:1.3}
.ad.sq .q p{font-size:3.2cqw}
.ad .q .st{color:var(--oro);font-size:4.6cqw;letter-spacing:.5cqw}
.ad .q .who{font-size:3.4cqw;font-weight:700}
.ad .cta{position:absolute;left:6cqw;right:6cqw;bottom:6cqw;background:var(--verde);color:#fff;text-align:center;font-weight:700;font-size:3cqw;padding:3cqw;letter-spacing:.08em}
.ad.sq .cta{left:5cqw;right:5cqw;bottom:4cqw;padding:2.2cqw;font-size:2.6cqw}
.ad svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.ad .tap{cursor:crosshair}
.ad .dim{position:absolute;inset:0;background:rgba(246,242,233,.72);display:grid;place-items:center;z-index:3;font-size:4cqw;font-weight:700;text-align:center;padding:10cqw}

/* Resultados */
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot div{background:var(--blanco);border-radius:var(--r);padding:12px 10px}
.tot b{display:block;font-size:24px;line-height:1.1}
.tot small{font-size:13px;color:var(--gris)}
.cap{font-size:13px;color:var(--gris);margin:8px 2px 0}
.ads{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.adrow{background:var(--blanco);border-radius:var(--r);padding:12px}
.adrow.best{box-shadow:inset 0 0 0 2px var(--oro)}
.a1{display:flex;align-items:center;gap:8px}
.code{font-size:13px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--claro)}
.a1 b{font-size:15px;flex:1;min-width:0}
.a1 small{font-size:13px;color:var(--gris)}
.bestt{font-size:11px;font-weight:700;color:var(--blanco);background:var(--oro);padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.a2{display:flex;align-items:center;gap:14px;margin-top:10px}
.a2 .n{font-size:13px;color:var(--gris)}
.a2 .n b{display:block;font-size:20px;color:var(--verde);line-height:1.1}
.a2 .btn{margin-left:auto}

/* Hojas que suben desde abajo */
.wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(10,25,21,.42);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;background:var(--crema);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:9px;background:#cfcfca;margin:4px auto 10px}
.sheet h2{font-size:19px;margin:2px 0 12px}
.menu{display:flex;flex-direction:column;background:var(--blanco);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;text-align:left;font-size:16px;border-bottom:1px solid #eeede9}
.menu button:last-child{border-bottom:0}
.menu button .ic{color:var(--verde)}
.menu button:active{background:var(--claro)}
.sheet .btn{width:100%;margin-top:16px}
.sw{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:8px 14px;background:var(--blanco);border-radius:12px;margin-top:16px;text-align:left;font-size:15px;font-weight:600}
.sw span{flex:1}
.knob{width:50px;height:30px;border-radius:99px;background:#cfd1ce;position:relative;flex:none;transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked=true] .knob{background:var(--verde)}
.sw[aria-checked=true] .knob::after{transform:translateX(20px)}
.stars{display:flex;align-items:center;gap:2px}
.stars button{width:44px;height:44px;font-size:28px;color:#cfcfca}
.stars button.on{color:var(--oro)}
.stars small{margin-left:8px;color:var(--gris);font-size:14px}
.preview{background:var(--blanco);border-radius:var(--r);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:contain}
.preview .art{width:88%}
.wa{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--claro);border-radius:12px;font-size:14px}
.wa b{font-size:15px}
.hint{font-size:13px;color:var(--gris);margin-top:6px}

/* Aviso abajo */
.toast{position:absolute;left:12px;right:12px;bottom:84px;z-index:30;background:var(--verde);color:var(--blanco);padding:12px 14px;border-radius:12px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:up .2s}

  if (b.dataset.opt) { if (S.opt !== b.dataset.opt) { S.opt = b.dataset.opt; S.compared = false; } return renderAnuncio(); }
  if (b.dataset.pt) { S.point = +b.dataset.pt; S.placing = true; renderAnuncio(); return ta.scrollTo({ top: 0, behavior: 'smooth' }); }
  if (b.dataset.rv) { p.pick = +b.dataset.rv; return renderAnuncio(); }
  if (b.dataset.go) { setTab('ficha'); if (b.dataset.go === 'reviews') $('#reviews').scrollIntoView({ block: 'start' }); return; }
  if (b.id === 'compared') { S.compared = !S.compared; return renderAnuncio(); }
  if (b.id === 'gen') return genSheet();
  if (b.id === 'frommobile') { pickFile((url) => { const id = 'm' + Date.now(); p.options.push({ id, bg: 'web', label: 'Del móvil', url }); S.opt = id; renderAnuncio(); toast('Foto añadida solo para el anuncio.'); }); }
});
ta.addEventListener('input', (e) => {
  const p = S.p, el = e.target;
  if (el.id === 'a-hl') p.headline = el.value;
  if (el.id === 'a-offer') p.offer = el.value;
  if (el.id === 'a-use') { p.use = el.value; renderBar(); }
  renderAd();
});
/* Fondo IA: el proveedor gratis va solo; si el administrador activa uno de pago, aquí saldría la elección */
function genSheet() {
  let whole = !!S.whole;
  sheet(`<h2>Fondo con IA</h2><button class="sw" role="switch" id="g-whole" aria-checked="${whole}" style="margin-top:0"><span>Foto entera, sin recortar</span><i class="knob"></i></button><button class="btn p" id="g-go">${ic('spark', 'sm')}Crear opción</button>`);
  $('#g-whole').onclick = () => { whole = !whole; $('#g-whole').setAttribute('aria-checked', whole); };
  $('#g-go').onclick = () => { S.whole = whole; closeSheet(); generate(); };
}
function generate() {
  const p = S.p, slot = $('#gen-slot');
  slot.outerHTML = `<span class="opt" id="gen-slot"><span class="pic"><span class="spin"></span></span>Creando…</span>`;
  $('#gen').disabled = true;
  setTimeout(() => {
    const n = p.options.filter((o) => o.ai).length + 1, bg = ['ia1', 'ia2', 'ia3'][(n - 1) % 3];
    p.options.push({ id: 'ia' + Date.now(), bg, label: 'IA ' + n, ai: true });
    S.opt = p.options.at(-1).id; S.compared = false; renderAnuncio(); toast('Opción lista. Revisa color y forma.');
  }, 1600);
}
function optSheet(id) {
  const p = S.p, o = p.options.find((x) => x.id === id); if (!o) return;
  sheet(`<h2>${esc(o.label)}</h2><div class="menu">
    <button id="o-web">${ic('web')}Poner como foto de la web</button>
    ${o.ai || o.saved ? `<button id="o-keep">${ic('bookmark')}Guardar para revisar</button>` : ''}
    <button id="o-dl">${ic('dl')}Descargar sin textos</button></div>`);
  $('#o-web').onclick = () => sheet(`<h2>¿Poner como foto de la web?</h2><div class="preview" style="background:${BG[o.bg] || '#fff'}">${o.url ? `<img src="${o.url}" alt="">` : `<span class="art">${artSVG(p.art)}</span>`}</div><p class="hint">La anterior queda en la galería.</p><button class="btn p" id="o-yes">Usar en la web</button>`) || ($('#o-yes').onclick = () => { closeSheet(); toast(p.status === 'publish' ? 'Foto de la web cambiada. Ya se ve en la tienda.' : 'Foto de la web cambiada.'); });
  $('#o-keep') && ($('#o-keep').onclick = () => { p.options.forEach((x) => { if (x.saved && x !== o) { x.saved = false; } }); o.saved = true; o.stale = false; closeSheet(); renderAnuncio(); toast('Guardada para revisar después.'); });
  $('#o-dl').onclick = () => { closeSheet(); toast('Descargaría la foto sin textos (1080 px).'); };
}

/* Pie del anuncio: un solo botón crea el enlace, descarga la imagen y copia el texto */
function pieText(code) {
  const p = S.p, facts = p.facts.filter((x) => x.f).map((x) => `• ${x.f}${x.b ? ' — ' + x.b : ''}`), r = p.reviews[p.pick ?? 0];
  return [p.headline || p.name, ...facts, S.tpl === 'use' ? p.use : '', p.price ? `Precio: ${p.price}` : '', S.tpl === 'offer' && p.offer ? `Oferta: ${p.offer}` : '', S.tpl === 'review' && r ? `«${r.text}» — ${r.name}` : '', 'Míralo en Casa Viva: casaviva.company/…', `Escríbenos por WhatsApp: wa.me/…?text=…${code}`].filter(Boolean).join('\n');
}
function pieSheet() {
  const code = 'A' + seq;
  sheet(`<h2>Pie del anuncio</h2><textarea class="inp" id="pie" rows="9">${esc(pieText(code))}</textarea>
    <div class="wa">${ic('wa')}<span><b>Enlace ${code}</b><br>Cuenta quién escribe y compra</span></div>
    <button class="btn p" id="go">${ic('dl', 'sm')}Descargar imagen y copiar pie</button>`);
  $('#go').onclick = (e) => busy(e.currentTarget, 'Preparando', 800, () => {
    const p = S.p;
    try { navigator.clipboard?.writeText($('#pie').value); } catch { /* sin permiso: solo prototipo */ }
    p.ads.unshift({ code, tpl: S.tpl, fmt: S.fmt, date: 'hoy', msgs: 0, orders: 0, total: '' }); seq++;
    S.newAd = true; closeSheet(); renderHead();
    toast(`Imagen descargada y pie copiado. Anuncio ${code} creado.`);
  });
}

/* ---------- Resultados ---------- */
function renderRes() {
  const p = S.p, ads = p.ads;
  if (!ads.length) { $('#t-res').innerHTML = `<div class="empty"><p style="margin-bottom:14px">Aún no hay anuncios.</p><button class="btn p" style="max-width:240px;margin:auto" data-go="anuncio">Crear anuncio</button></div>`; renderBar(); return; }
  const best = [...ads].sort((a, b) => b.orders - a.orders || b.msgs - a.msgs)[0];
  const sum = (k) => ads.reduce((s, a) => s + a[k], 0), money = ads.reduce((s, a) => s + (parseFloat(a.total.replace(/[^\d.]/g, '')) || 0), 0);
  $('#t-res').innerHTML = `<div class="tot"><div><b>${sum('msgs')}</b><small>escribieron</small></div><div><b>${sum('orders')}</b><small>pedidos</small></div><div><b>US$${money}</b><small>vendido</small></div></div>
    <p class="cap">Pedidos hasta 14 días después de escribir.</p>
    <ul class="ads">${ads.map((a) => `<li class="adrow ${a === best && a.msgs ? 'best' : ''}"><div class="a1"><span class="code">${a.code}</span><b>${TPL[a.tpl]} · ${a.fmt === '1080' ? '1:1' : '9:16'}</b>${a === best && a.msgs ? '<span class="bestt">Mejor</span>' : ''}<small>${a.date}</small></div>
      <div class="a2"><span class="n"><b>${a.msgs}</b>escribieron</span><span class="n"><b>${a.orders}</b>pedidos</span>${a.total ? `<span class="n"><b>${a.total}</b>vendido</span>` : ''}<button class="btn o sm" data-rep="${a.code}">${ic('repeat', 'sm')}Repetir</button></div></li>`).join('')}</ul>`;
  renderBar();
}
$('#t-res').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) return setTab('anuncio');
  const a = S.p.ads.find((x) => x.code === b.dataset.rep); if (!a) return;
  S.tpl = a.tpl; S.fmt = a.fmt; setTab('anuncio'); toast('Misma plantilla y formato. Cambia la foto o la frase.');
});

/* ---------- Hojas: cuenta, producto, foto, reseña ---------- */
function pickFile(cb) { const f = $('#file'); f.value = ''; f.onchange = () => { const file = f.files[0]; if (file) cb(URL.createObjectURL(file)); }; f.click(); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-sheet]'); if (!b || b.disabled) return;
  const p = S.p, k = b.dataset.sheet;
  if (k === 'account') {
    sheet(`<h2>Zayri</h2><div class="menu"><button id="m-pw">${ic('key')}Cambiar contraseña</button><button id="m-acc">${ic('user')}Mi cuenta</button><button id="m-out">${ic('out')}Salir</button></div>`);
    $('#m-pw').onclick = () => { sheet(`<h2>Cambiar contraseña</h2><div class="field" style="margin-top:0"><div class="lab"><label for="pw1">Actual</label></div><input class="inp" id="pw1" type="password" autocomplete="current-password"></div><div class="field"><div class="lab"><label for="pw2">Nueva</label><small>mínimo 12</small></div><input class="inp" id="pw2" type="password" autocomplete="new-password" minlength="12"></div><button class="btn p" id="pw-go" disabled>Guardar y volver a entrar</button>`);
      const chk = () => { $('#pw-go').disabled = !($('#pw1').value && $('#pw2').value.length >= 12); }; $('#pw1').oninput = chk; $('#pw2').oninput = chk;
      $('#pw-go').onclick = () => { closeSheet(); toast('Volvería a la entrada con la contraseña nueva.'); }; };
    $('#m-acc').onclick = () => { closeSheet(); toast('Abriría Mi cuenta.'); };
    $('#m-out').onclick = () => { closeSheet(); toast('Cerraría la sesión.'); };
  }
  if (k === 'pmenu') {
    sheet(`<h2>${esc(p.name)}</h2><div class="menu">${p.status === 'publish' ? `<button id="m-view">${ic('ext')}Ver en la tienda</button>` : ''}<button id="m-txt">${ic('dl')}Descargar textos (.txt)</button><button id="m-gpt">${ic('copy')}Copiar instrucción para ChatGPT</button></div>`);
    $('#m-view') && ($('#m-view').onclick = () => { closeSheet(); toast('Abriría la ficha en casaviva.company.'); });
    $('#m-txt').onclick = () => { keepEdits(); const txt = `TÍTULO\n${p.name}\n\nDESCRIPCIÓN\n${p.desc}\n\nTEXTO PARA REDES\n${pieText('A?')}\n`; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' })); a.download = 'casa-viva-textos.txt'; a.click(); closeSheet(); };
    $('#m-gpt').onclick = () => { try { navigator.clipboard?.writeText(`Crea una imagen comercial para Casa Viva con la foto real adjunta…`); } catch { /* prototipo */ } closeSheet(); toast('Instrucción copiada. Adjunta la foto real en ChatGPT y trae el resultado con «Del móvil».'); };
  }
  if (k === 'foto') {
    sheet(`<h2>Foto de la web</h2><div class="menu"><button id="f-cam">${ic('cam')}Tomar foto</button><button id="f-gal">${ic('img')}Elegir de la galería</button></div>`);
    const go = (capture) => { const f = $('#file'); capture ? f.setAttribute('capture', 'environment') : f.removeAttribute('capture');
      pickFile((url) => { sheet(`<h2>¿Usar esta foto?</h2><div class="preview"><img src="${url}" alt="Foto elegida"></div><p class="hint">La anterior queda en la galería.</p><button class="btn p" id="f-up">${ic('up', 'sm')}Subir a la web</button>`);
        $('#f-up').onclick = (ev) => busy(ev.currentTarget, 'Subiendo', 900, () => { const isNew = p.status === 'new'; keepEdits(); if (isNew && !p.name.trim()) p.name = 'Producto sin título'; p.photoURL = url; p.hasPhoto = true; if (isNew) save(false); closeSheet(); renderFicha(); toast(isNew ? 'Borrador guardado y foto subida.' : 'Foto subida en WebP.'); }); }); };
    $('#f-cam').onclick = () => go(true); $('#f-gal').onclick = () => go(false);
  }
  if (k === 'review') {
    const st = { rating: 0, ok: false };
    sheet(`<h2>Reseña real</h2><div class="field" style="margin-top:0"><div class="lab"><label for="r-t">Comentario del cliente</label></div><textarea class="inp" id="r-t" rows="3" maxlength="400" placeholder="Pégalo tal cual del WhatsApp"></textarea></div>
      <div class="field"><div class="lab"><label for="r-n">Nombre e inicial</label></div><input class="inp" id="r-n" maxlength="60" placeholder="María G., La Habana"></div>
      <div class="field"><div class="lab"><span>Estrellas</span></div><div class="stars" id="r-s">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}" aria-label="${n} estrellas">★</button>`).join('')}<small id="r-sl">Sin estrellas</small></div></div>
      <button class="sw" role="switch" id="r-ok" aria-checked="false"><span>El cliente dio permiso</span><i class="knob"></i></button>
      <button class="btn p" id="r-go" disabled>Guardar reseña</button>`);
    const chk = () => { $('#r-go').disabled = !(st.ok && $('#r-t').value.trim().length >= 5 && $('#r-n').value.trim()); };
    $('#r-t').oninput = chk; $('#r-n').oninput = chk;
    $('#r-s').onclick = (ev) => { const s = ev.target.closest('[data-n]'); if (!s) return; st.rating = st.rating === +s.dataset.n ? 0 : +s.dataset.n; $$('#r-s [data-n]').forEach((x) => x.classList.toggle('on', +x.dataset.n <= st.rating)); $('#r-sl').textContent = st.rating ? `${st.rating} de 5` : 'Sin estrellas'; };
    $('#r-ok').onclick = () => { st.ok = !st.ok; $('#r-ok').setAttribute('aria-checked', st.ok); chk(); };
    $('#r-go').onclick = () => { keepEdits(); p.reviews.unshift({ id: Date.now(), text: $('#r-t').value.trim(), name: $('#r-n').value.trim(), rating: st.rating, origin: 'WhatsApp' }); closeSheet(); renderFicha(); toast('Reseña guardada. Ya sale en la tienda.'); };
  }
});

/* ---------- Atajos del recorrido (solo en escritorio) ---------- */
$$('[data-jump]').forEach((b) => b.onclick = () => {
  closeSheet(); const j = b.dataset.jump;
  if (j === 'list') return goList();
  if (j === 'new') return $('#new').click();
  openProduct(products.find((p) => p.id === 3747), j);
});
window.addEventListener('resize', () => requestAnimationFrame(drawLines));
renderList();
})();
</script>
</body>
</html>
