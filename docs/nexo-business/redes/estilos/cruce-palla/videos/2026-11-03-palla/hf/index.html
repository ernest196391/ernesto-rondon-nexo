<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pa'llá · Casa Viva</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Reel de Pa'llá 3-nov-2026 (estilo clonado del reel DeincFHNoTX): Cúrru y Prosko chocan,
         todo vuela a cámara lenta y el móvil llega a cámara con Pa'llá (capturas REALES de la app;
         en la 1.ª se tapó el nombre del mensajero). Para mensajeros. Sin enlace ni teléfono (D96). */
      @font-face { font-family: "Figtree"; src: url("assets/fuentes/figtree.ttf") format("truetype"); font-weight: 300 900; }
      @font-face { font-family: "Cinzel"; src: url("assets/fuentes/cinzel.ttf") format("truetype"); font-weight: 400 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Figtree", sans-serif; }
      .escena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #fondo-img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #oscuro { position: absolute; inset: 0; background: rgba(10, 8, 6, 0.35); }

      /* Móvil con Pa'llá */
      #movil { position: absolute; left: 250px; top: 420px; width: 580px; height: 1220px; border-radius: 74px; background: #111; padding: 22px;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55); }
      #pantalla { position: relative; width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #fff; }
      .cap { position: absolute; left: 0; top: 62px; width: 100%; height: calc(100% - 62px); object-fit: cover; object-position: 50% 0%; opacity: 0; }
      #isla { position: absolute; left: 50%; top: 18px; width: 150px; height: 40px; margin-left: -75px; border-radius: 20px; background: #111; }

      /* Subtítulos como la referencia: amarillo, gruesos, con sombra */
      .sub { position: absolute; left: 70px; width: 940px; text-align: center; font-weight: 800; font-size: 76px; line-height: 1.1; color: #ffd84a; opacity: 0;
        text-shadow: 0 4px 0 #2b2420, 0 0 22px rgba(0, 0, 0, 0.75); }
      .abajo { top: 1250px; }
      .arriba { top: 250px; }

      /* Cierre */
      #fin { position: absolute; inset: 0; background: #0d3b45; }
      #fin-a { position: absolute; left: 60px; width: 960px; top: 400px; text-align: center; font-weight: 700; font-size: 64px; color: #f6f1e6; }
      #fin-caja { position: absolute; left: 160px; width: 760px; top: 520px; padding: 22px 0; border-radius: 28px; background: #ffd84a; text-align: center; font-weight: 900; font-size: 120px; color: #2b2420; }
      #fin-b { position: absolute; left: 60px; width: 960px; top: 760px; text-align: center; font-weight: 600; font-size: 58px; line-height: 1.2; color: #f6f1e6; }
      #fin-c { position: absolute; left: 60px; width: 960px; top: 960px; text-align: center; font-weight: 500; font-size: 44px; color: #e8c9a4; }
      #fin-logo { position: absolute; left: 315px; top: 1170px; width: 450px; height: auto; }
      #destello { position: absolute; inset: 0; background: #fff3dc; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <!-- 1 · Caminan, chocan y todo vuela (0–4,6 s) -->
      <video id="v-choque" class="clip escena" src="assets/clips/choque.mp4" muted playsinline data-start="0" data-media-start="0" data-duration="4.6" data-track-index="1"></video>

      <!-- 2 · El móvil llega a cámara con Pa'llá (4,6–11,2 s) -->
      <div id="s-movil" class="clip" data-start="4.6" data-duration="6.6" data-track-index="2" data-layout-allow-overlap style="position:absolute; inset:0;">
        <div id="fondo-cam" style="position:absolute; inset:0;"><img id="fondo-img" src="assets/usar/fondo.jpg" alt="" /></div>
        <div id="oscuro"></div>
        <div id="movil"><div id="pantalla">
          <img class="cap" id="cap1" src="assets/usar/p1-carreras.png" alt="" />
          <img class="cap" id="cap2" src="assets/usar/p2-dinero.png" alt="" />
          <img class="cap" id="cap3" src="assets/usar/p3-sinsenal.png" alt="" />
          <div id="isla"></div>
        </div></div>
      </div>

      <!-- 3 · Los dos en la acera, riéndose (11,2–12,45 s; se saltan los planos de Prosko con dibujo en la camiseta) -->
      <video id="v-risa" class="clip escena" src="assets/clips/choque.mp4" muted playsinline data-start="11.2" data-media-start="6.9" data-duration="1.25" data-track-index="1"></video>

      <!-- 4 · Cierre (12,45–16 s) -->
      <div id="cierre" class="clip" data-start="12.45" data-duration="3.55" data-track-index="3" data-layout-allow-overlap style="position:absolute; inset:0;">
        <div id="fin">
          <div id="fin-a">Escribe</div>
          <div id="fin-caja">Pa'llá</div>
          <div id="fin-b">al WhatsApp de Casa Viva<br />y te la mandamos</div>
          <div id="fin-c">Enlace en la descripción</div>
          <img id="fin-logo" src="assets/logo-vertical-crema.svg" alt="Casa Viva" />
        </div>
      </div>

      <!-- Subtítulos -->
      <div class="sub abajo" id="t1">Dijiste: «quiero ganar dinero repartiendo»</div>
      <div class="sub abajo" id="t2">Tu teléfono te escuchó…</div>
      <div class="sub arriba" id="t3">Y aquí estoy: Pa'llá</div>
      <div class="sub arriba" id="t4">Coges la carrera con un toque</div>
      <div class="sub arriba" id="t5">Ves cuánto ganas cada día</div>
      <div class="sub arriba" id="t6">Y funciona sin señal</div>
      <div class="sub abajo" id="t7">Para mensajeros y mensajeras de Casa Viva</div>
      <div id="destello"></div>

      <audio id="musica" src="assets/musica.mp3" data-start="0" data-media-start="0" data-duration="16" data-track-index="10" data-volume="0.6"></audio>
      <audio id="fx-golpe" src="assets/sfx/impact-bass-1.mp3" data-start="1.8" data-duration="1.6" data-track-index="11" data-volume="0.75"></audio>
      <audio id="fx-lento" src="assets/sfx/whoosh.mp3" data-start="2.0" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <audio id="fx-movil" src="assets/sfx/riser.mp3" data-start="4.2" data-duration="1" data-track-index="13" data-volume="0.45"></audio>
      <audio id="fx-noti" src="assets/sfx/notification.mp3" data-start="5.0" data-duration="1" data-track-index="14" data-volume="0.6"></audio>
      <audio id="fx-pop1" src="assets/sfx/pop.mp3" data-start="6.8" data-duration="0.6" data-track-index="15" data-volume="0.5"></audio>
      <audio id="fx-pop2" src="assets/sfx/pop.mp3" data-start="9.0" data-duration="0.6" data-track-index="15" data-volume="0.5"></audio>
      <audio id="fx-w" src="assets/sfx/whoosh-short.mp3" data-start="11.1" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <audio id="fx-brillo" src="assets/sfx/sparkle.mp3" data-start="12.75" data-duration="1.8" data-track-index="16" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Subtítulos: [id, entra, sale]
      const subs = [["#t1", 0.2, 2.4], ["#t2", 2.6, 4.5], ["#t3", 4.9, 5.8], ["#t4", 5.9, 6.8], ["#t5", 6.9, 9.0], ["#t6", 9.1, 11.1], ["#t7", 11.25, 12.45]];
      for (const [id, a, b] of subs) {
        tl.fromTo(id, { y: 24, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, a);
        tl.to(id, { opacity: 0, duration: 0.15, ease: "power1.in" }, b - 0.15);
      }
      // El móvil vuela hacia la cámara y se queda flotando
      tl.fromTo("#fondo-cam", { scale: 1.05 }, { scale: 1.15, duration: 6.6, ease: "none" }, 4.6);
      tl.fromTo("#movil", { scale: 0.25, rotation: -28, y: -260, x: 120 }, { scale: 1, rotation: -5, y: 0, x: 0, duration: 0.9, ease: "power3.out" }, 4.6);
      tl.to("#movil", { rotation: 4, y: -18, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.5);
      tl.set("#cap1", { opacity: 1 }, 4.6);
      tl.set("#cap2", { opacity: 1 }, 6.8);
      tl.set("#cap3", { opacity: 1 }, 9.0);
      tl.fromTo("#cap2", { y: 60 }, { y: 0, duration: 0.3, ease: "power2.out" }, 6.8);
      tl.fromTo("#cap3", { y: 60 }, { y: 0, duration: 0.3, ease: "power2.out" }, 9.0);
      tl.to("#movil", { scale: 1.6, y: 200, opacity: 0, duration: 0.35, ease: "power2.in" }, 10.85);
      // Destellos en los cortes
      for (const t of [4.6, 11.2, 12.45]) {
        tl.set("#destello", { opacity: 0.4 }, t);
        tl.to("#destello", { opacity: 0, duration: 0.25, ease: "power1.out" }, t + 0.001);
      }
      // Cierre
      tl.fromTo("#fin-a", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 12.5);
      tl.fromTo("#fin-caja", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 12.7);
      tl.to("#fin-caja", { scale: 1.06, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 13.15);
      tl.fromTo("#fin-b", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.95);
      tl.fromTo("#fin-c", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 13.25);
      tl.fromTo("#fin-logo", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 13.35);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
