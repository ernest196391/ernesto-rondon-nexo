<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>El café de los distraídos · Casa Viva</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* «El café de los distraídos» 4-nov-2026: remake del reel De_iWd6IxX2 con Cúrru y Prosko
         (mamá e hijo, realistas). Un solo plano de Seedance 2.0 guiado por el video original
         + canción de Casa Viva + cierre de marca. Sin producto, sin enlace ni teléfono (D96). */
      @font-face { font-family: "Figtree"; src: url("assets/fuentes/figtree.ttf") format("truetype"); font-weight: 300 900; }
      @font-face { font-family: "Cinzel"; src: url("assets/fuentes/cinzel.ttf") format("truetype"); font-weight: 400 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Figtree", sans-serif; }
      .escena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #fin { position: absolute; inset: 0; background: #0d3b45; }
      #fin-preg { position: absolute; left: 60px; width: 960px; top: 470px; text-align: center; font-weight: 800; font-size: 92px; line-height: 1.1; color: #f6f1e6; }
      #fin-sub { position: absolute; left: 60px; width: 960px; top: 820px; text-align: center; font-weight: 500; font-size: 52px; line-height: 1.25; color: #e8c9a4; }
      #fin-logo { position: absolute; left: 290px; top: 1120px; width: 500px; height: auto; }
      #destello { position: absolute; inset: 0; background: #fff3dc; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <video id="cafe" class="clip escena" src="assets/clips/cafe.mp4" muted playsinline data-start="0" data-duration="15" data-track-index="1"></video>

      <div id="cierre" class="clip" data-start="15" data-duration="3" data-track-index="2" data-layout-allow-overlap style="position:absolute; inset:0;">
        <div id="fin">
          <div id="fin-preg">¿Tu hijo también te «ayuda» así?</div>
          <div id="fin-sub">Cuéntanos en los comentarios</div>
          <img id="fin-logo" src="assets/logo-vertical-crema.svg" alt="Casa Viva" />
        </div>
      </div>
      <div id="destello"></div>

      <audio id="musica" src="assets/musica.mp3" data-start="0" data-media-start="0" data-duration="18" data-track-index="10" data-volume="0.75"></audio>
      <audio id="fx-cafe1" src="assets/sfx/click-soft.mp3" data-start="1.5" data-duration="0.36" data-track-index="11" data-volume="0.5"></audio>
      <audio id="fx-cafe2" src="assets/sfx/click-soft.mp3" data-start="5.6" data-duration="0.36" data-track-index="11" data-volume="0.5"></audio>
      <audio id="fx-leche" src="assets/sfx/pop.mp3" data-start="10.2" data-duration="0.6" data-track-index="12" data-volume="0.6"></audio>
      <audio id="fx-w" src="assets/sfx/whoosh-short.mp3" data-start="14.9" data-duration="0.57" data-track-index="13" data-volume="0.45"></audio>
      <audio id="fx-brillo" src="assets/sfx/sparkle.mp3" data-start="15.3" data-duration="1.8" data-track-index="14" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#destello", { opacity: 0.35 }, 15);
      tl.to("#destello", { opacity: 0, duration: 0.25, ease: "power1.out" }, 15.001);
      tl.fromTo("#fin-preg", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 15.05);
      tl.fromTo("#fin-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 15.4);
      tl.fromTo("#fin-logo", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 15.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
