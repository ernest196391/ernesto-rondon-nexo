[package]
name = "nexo-business-db"
version = "0.0.1"
description = "NEXO Business local SQLite migrations and transactional repositories"
edition = "2021"
publish = false

[lib]
name = "nexo_business_db"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
