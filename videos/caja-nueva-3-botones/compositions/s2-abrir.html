<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s2-root { position: absolute; inset: 0; }
        #s2-wrap { position: absolute; inset: 0; }
        #s2-cur { display: flex; align-items: baseline; gap: 14px; }
        #s2-cur .cu { font-weight: 600; font-size: 36px; color: #574C44; }
        #s2-ok path { stroke-dasharray: 21; }
      </style>
      <div id="s2-root" data-composition-id="s2-abrir" data-width="1080" data-height="1920">
        <div id="s2-wrap">
          <div id="s2-when" class="when">9:00 · POR LA MAÑANA</div>
          <div id="s2-cap" class="cap"><span class="ci">Al llegar: <span class="k">abres el día</span> y cuentas el cajón</span></div>
          <div class="bd" data-layout-allow-overlap data-layout-allow-occlusion>
            <div id="s2-pg" class="pg">
              <div id="s2-h" class="h1">Abrir el día</div>
              <div id="s2-sub" class="sub">Hola, Nana. ¿Cuánto dinero hay en el cajón?</div>
              <div id="s2-f1" class="fld">
                <div class="lb">Dólares (USD)</div>
                <div class="vl"><span id="s2-a1">8</span><span id="s2-a2">0</span></div>
                <i class="tap" id="s2-t1"><b class="td"></b><b class="tr"></b></i>
              </div>
              <div id="s2-f2" class="fld">
                <div class="lb">Pesos (CUP)</div>
                <div class="vl"><span id="s2-b1">5</span><span id="s2-b2">.</span><span id="s2-b3">0</span><span id="s2-b4">0</span><span id="s2-b5">0</span></div>
                <i class="tap" id="s2-t2"><b class="td"></b><b class="tr"></b></i>
              </div>
              <div class="spacer"></div>
              <div id="s2-btn" class="btn">Abrir el día<i class="tap" id="s2-t3"><b class="td"></b><b class="tr"></b></i></div>
            </div>
            <div id="s2-ok" class="ok-ov">
              <div class="ok-ci"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
              <div class="ok-t">Día abierto</div>
              <div class="ok-s">80 USD y 5.000 CUP en el cajón</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const tap = (id, t) => {
            tl.fromTo(id + " .td", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, t - 0.3);
            tl.to(id + " .td", { opacity: 0, scale: 0.8, duration: 0.3, ease: "power1.in" }, t + 0.25);
            tl.fromTo(id + " .tr", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
          };
          const press = (sel, t) => {
            tl.fromTo(sel, { scale: 1 }, { scale: 0.96, duration: 0.1, ease: "power1.out", immediateRender: false }, t);
            tl.to(sel, { scale: 1, duration: 0.25, ease: "back.out(3)" }, t + 0.1);
          };
          const ok = (pre, t) => {
            tl.fromTo(pre, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t);
            tl.fromTo(pre + " .ok-ci", { scale: 0.4 }, { scale: 1, duration: 0.55, ease: "back.out(2)" }, t + 0.1);
            tl.fromTo(pre + " path", { strokeDashoffset: 21 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t + 0.35);
            tl.fromTo(pre + " .ok-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.4);
            tl.fromTo(pre + " .ok-s", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.6);
          };
          // caption
          tl.fromTo("#s2-when", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.05);
          tl.fromTo("#s2-cap .ci", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
          // screen
          tl.fromTo("#s2-h, #s2-sub", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 }, 0.3);
          tl.fromTo("#s2-f1, #s2-f2, #s2-btn", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.14 }, 0.55);
          // type USD
          tap("#s2-t1", 1.7);
          tl.fromTo("#s2-f1", { borderColor: "#DCD2C1" }, { borderColor: "#0D3B45", duration: 0.15, immediateRender: false }, 1.7);
          tl.fromTo("#s2-a1, #s2-a2", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.28 }, 2.0);
          tl.to("#s2-f1", { borderColor: "#DCD2C1", duration: 0.15 }, 2.9);
          // type CUP
          tap("#s2-t2", 3.0);
          tl.fromTo("#s2-f2", { borderColor: "#DCD2C1" }, { borderColor: "#0D3B45", duration: 0.15, immediateRender: false }, 3.0);
          tl.fromTo("#s2-b1, #s2-b2, #s2-b3, #s2-b4, #s2-b5", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.2 }, 3.3);
          tl.to("#s2-f2", { borderColor: "#DCD2C1", duration: 0.15 }, 4.4);
          // open
          tap("#s2-t3", 4.8);
          press("#s2-btn", 4.8);
          ok("#s2-ok", 5.2);
          tl.to("#s2-root .bd > :not(.ok-ov)", { opacity: 0, duration: 0.01 }, 5.2 + 0.35);
          tl.to("#s2-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 7.6);
          window.__timelines["s2-abrir"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
