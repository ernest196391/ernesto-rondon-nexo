<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s4-root { position: absolute; inset: 0; }
        #s4-wrap { position: absolute; inset: 0; }
        #s4-ok path { stroke-dasharray: 21; }
        .s4-c { display: flex; flex-direction: column; gap: 10px; }
        .s4-c .chip { align-self: flex-start; margin-top: 6px; }
        #s4-tot { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 4px 0; }
        #s4-tot .t1 { font-size: 42px; }
        #s4-tot .amt { font-size: 66px; }
        #s4-pay { display: flex; flex-wrap: wrap; gap: 14px; }
        #s4-pay .chip { height: 70px; font-size: 32px; padding: 0 26px; position: relative; }
        #s4-pg2 { gap: 24px; }
      </style>
      <div id="s4-root" data-composition-id="s4-pedido" data-width="1080" data-height="1920">
        <div id="s4-wrap">
          <div id="s4-when" class="when">11:20 · COBRAR PEDIDO</div>
          <div id="s4-cap" class="cap"><span class="ci">Los pedidos de las gestoras salen aquí. <span class="k">Tocas, cobras y listo.</span></span></div>
          <div class="bd" data-layout-allow-overlap data-layout-allow-occlusion>
            <div id="s4-pg1" class="pg">
              <div id="s4-h" class="h1">Pedidos de hoy</div>
              <div id="s4-c1" class="card s4-c">
                <div class="row"><span class="t1">#4249 · Katia</span><span class="amt">60 USD</span></div>
                <div class="t2">Cama plegable</div>
                <span class="chip info">Recogida en la tienda</span>
                <i class="tap" id="s4-t1" style="left:62%"><b class="td"></b><b class="tr"></b></i>
              </div>
              <div id="s4-c2" class="card s4-c">
                <div class="row"><span class="t1">#4238 · Day</span><span class="amt">88 USD</span></div>
                <div class="t2">4 almohadas</div>
                <span class="chip warn">Lo trae Félix</span>
              </div>
              <div id="s4-c3" class="card s4-c">
                <div class="row"><span class="t1">#4251 · Mary</span><span class="amt">25 USD</span></div>
                <div class="t2">Juego de sábanas</div>
                <span class="chip info">Recogida en la tienda</span>
              </div>
            </div>
            <div id="s4-pg2" class="pg">
              <div class="back">‹ Pedidos</div>
              <div class="h1">#4249 · Katia</div>
              <div class="card s4-c">
                <div class="row"><span class="t1">Cama plegable</span><span class="t2">1 ×</span></div>
                <div class="row"><span class="t2">Recogida en la tienda</span><span class="amt">60 USD</span></div>
              </div>
              <div id="s4-tot"><span class="t1">Total</span><span class="amt">60 USD</span></div>
              <div class="sub">¿Cómo paga?</div>
              <div id="s4-pay">
                <span id="s4-ef" class="chip off">Efectivo USD<i class="tap" id="s4-t2"><b class="td"></b><b class="tr"></b></i></span>
                <span class="chip off">CUP</span>
                <span class="chip off">Transferencia</span>
              </div>
              <div class="spacer"></div>
              <div id="s4-btn" class="btn">Cobrar 60 USD<i class="tap" id="s4-t3"><b class="td"></b><b class="tr"></b></i></div>
            </div>
            <div id="s4-ok" class="ok-ov">
              <div class="ok-ci"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
              <div class="ok-t">Cobrado</div>
              <div class="ok-s">#4249 · Katia · 60 USD</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const tap = (id, t) => {
            tl.fromTo(id + " .td", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, t - 0.3);
            tl.to(id + " .td", { opacity: 0, scale: 0.8, duration: 0.3, ease: "power1.in" }, t + 0.25);
            tl.fromTo(id + " .tr", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
          };
          const press = (sel, t) => {
            tl.fromTo(sel, { scale: 1 }, { scale: 0.96, duration: 0.1, ease: "power1.out", immediateRender: false }, t);
            tl.to(sel, { scale: 1, duration: 0.25, ease: "back.out(3)" }, t + 0.1);
          };
          const ok = (pre, t) => {
            tl.fromTo(pre, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t);
            tl.fromTo(pre + " .ok-ci", { scale: 0.4 }, { scale: 1, duration: 0.55, ease: "back.out(2)" }, t + 0.1);
            tl.fromTo(pre + " path", { strokeDashoffset: 21 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t + 0.35);
            tl.fromTo(pre + " .ok-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.4);
            tl.fromTo(pre + " .ok-s", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.6);
          };
          tl.fromTo("#s4-when", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.05);
          tl.fromTo("#s4-cap .ci", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
          tl.fromTo("#s4-pg2", { xPercent: 100 }, { xPercent: 100, duration: 0.01 }, 0);
          tl.fromTo("#s4-h", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 0.3);
          tl.fromTo("#s4-c1, #s4-c2, #s4-c3", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.18 }, 0.5);
          // tap Katia's order
          tl.fromTo("#s4-c1", { borderColor: "#DCD2C1" }, { borderColor: "#A35A1F", duration: 0.2, immediateRender: false }, 2.3);
          tap("#s4-t1", 2.4);
          press("#s4-c1", 2.4);
          tl.to("#s4-pg1", { xPercent: -30, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2.85);
          tl.to("#s4-pg2", { xPercent: 0, duration: 0.5, ease: "power3.out" }, 2.85);
          // choose cash
          tap("#s4-t2", 4.3);
          tl.fromTo("#s4-ef", { backgroundColor: "#EFE8DA", color: "#574C44" }, { backgroundColor: "#0D3B45", color: "#F6F1E6", duration: 0.2, immediateRender: false }, 4.3);
          // charge
          tap("#s4-t3", 5.4);
          press("#s4-btn", 5.4);
          ok("#s4-ok", 5.8);
          tl.to("#s4-root .bd > :not(.ok-ov)", { opacity: 0, duration: 0.01 }, 5.8 + 0.35);
          tl.to("#s4-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 8.6);
          window.__timelines["s4-pedido"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
