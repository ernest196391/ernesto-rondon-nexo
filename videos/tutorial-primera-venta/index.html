      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree-800.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
      }
      @font-face {
        font-family: "Segoe UI Emoji";
        src: local("Segoe UI Emoji");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f6f1e6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f6f1e6;
        color: #25231f;
        font-family: "Figtree", "Segoe UI Emoji", sans-serif;
      }

      /* ---------- shared scene vocabulary (used by the sub-compositions) ---------- */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 140px;
        height: 240px;
        display: flex;
        align-items: center;
        font-weight: 800;
        font-size: 74px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        color: #0f3d3e;
        text-wrap: balance;
        opacity: 0;
      }
      .cap .ci {
        display: block;
        width: 100%;
      }
      .cap .k {
        padding: 0 8px;
        border-radius: 6px;
        background-image: linear-gradient(transparent 60%, rgba(163, 90, 36, 0.38) 60%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }
      .scr {
        position: absolute;
        left: 230px;
        top: 418px;
        width: 620px;
        height: 1388px;
        border-radius: 48px;
        overflow: hidden;
        background: #f4efe4;
      }
      .sb {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 46px;
        padding: 0 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        font-size: 22px;
        color: #25231f;
        background: #f4efe4;
        z-index: 5;
      }
      .sb-icons {
        display: flex;
        gap: 6px;
        align-items: flex-end;
      }
      .sb-bar {
        display: block;
        width: 6px;
        border-radius: 2px;
        background: currentColor;
      }
      .sb-batt {
        display: block;
        width: 36px;
        height: 18px;
        margin-left: 6px;
        border-radius: 5px;
        border: 3px solid currentColor;
        position: relative;
      }
      .sb-batt::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        bottom: 2px;
        width: 20px;
        border-radius: 2px;
        background: currentColor;
      }
      .shot {
        position: absolute;
        left: 0;
        top: 46px;
        width: 620px;
        height: 1342px;
        display: block;
      }
      .shot.cover {
        object-fit: cover;
        object-position: center top;
      }
      .hl {
        position: absolute;
        border: 5px solid #a35a24;
        border-radius: 18px;
        background: rgba(163, 90, 36, 0.1);
        opacity: 0;
        z-index: 7;
      }
      .tap {
        position: absolute;
        width: 92px;
        height: 92px;
        z-index: 9;
        opacity: 0;
      }
      .tap-dot {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(163, 90, 36, 0.35);
        border: 5px solid #a35a24;
      }
      .tap-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid #a35a24;
        opacity: 0;
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgba(37, 35, 31, 0.32);
        opacity: 0;
        z-index: 6;
      }
      /* chat (WhatsApp-style, brand colours) */
      .chat-head {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 150px;
        padding: 46px 28px 0;
        background: #0f3d3e;
        color: #f6f1e6;
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 6;
      }
      .avatar {
        flex: 0 0 auto;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 32px;
        background: #e4ece8;
        color: #0f3d3e;
      }
      .chat-title {
        font-weight: 800;
        font-size: 34px;
        line-height: 1.1;
      }
      .chat-sub {
        font-weight: 400;
        font-size: 24px;
        color: #e4ece8;
      }
      .chat-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        bottom: 0;
        background: #e4ece8;
        background-image: radial-gradient(rgba(15, 61, 62, 0.08) 2px, transparent 2.5px);
        background-size: 34px 34px;
        padding: 26px 22px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .bubble {
        max-width: 90%;
        padding: 18px 22px 12px;
        border-radius: 20px;
        background: #fffdf9;
        color: #25231f;
        line-height: 1.3;
        box-shadow: 0 3px 0 rgba(15, 61, 62, 0.08);
      }
      .bubble.out {
        align-self: flex-end;
        background: #d6e7dd;
        border-top-right-radius: 6px;
      }
      .bubble .time {
        display: block;
        text-align: right;
        font-size: 21px;
        color: #55514a;
        margin-top: 6px;
      }
      .day-chip {
        align-self: center;
        padding: 8px 22px;
        border-radius: 14px;
        background: #fffdf9;
        color: #6f6a62;
        font-size: 23px;
        font-weight: 600;
      }
      /* notification cards */
      .ntf {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 64px;
        padding: 22px 22px 24px;
        border-radius: 26px;
        background: #fffdf9;
        box-shadow: 0 18px 40px rgba(37, 35, 31, 0.32);
        display: flex;
        gap: 18px;
        align-items: flex-start;
        z-index: 8;
        opacity: 0;
      }
      .ntf-ic {
        flex: 0 0 auto;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #25d366;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ntf-b {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ntf-h {
        display: flex;
        justify-content: space-between;
        font-size: 24px;
        color: #6f6a62;
      }
      .ntf-h b {
        color: #25231f;
        font-weight: 800;
      }
      .ntf-t {
        font-size: 30px;
        line-height: 1.32;
        color: #25231f;
      }
      .mk {
        position: relative;
        display: inline-block;
        font-weight: 800;
        color: #0f3d3e;
      }
      .mk-bar {
        position: absolute;
        left: -4px;
        right: -4px;
        bottom: 2px;
        height: 16px;
        border-radius: 5px;
        background: rgba(163, 90, 36, 0.42);
        transform-origin: left center;
      }
      .mk-t {
        position: relative;
      }
