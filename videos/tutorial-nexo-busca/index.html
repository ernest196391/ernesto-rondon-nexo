      * {
        margin: 0;

      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F6F1E6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F6F1E6;
        color: #2B2420;
        font-family: "Figtree", "Segoe UI Emoji", sans-serif;

      /* ---------- shared scene vocabulary (used by the sub-compositions) ---------- */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 140px;
        height: 240px;
        display: flex;
        align-items: center;
        font-weight: 600;
        font-size: 74px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        color: #0D3B45;
        text-wrap: balance;
        opacity: 0;
      }
      .cap .ci {
        display: block;
        width: 100%;
      }
      .cap .k {
        padding: 0 8px;
        border-radius: 6px;
        background-image: linear-gradient(transparent 60%, rgba(163, 90, 31, 0.38) 60%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }
      .scr {
        position: absolute;
        left: 230px;
        top: 418px;
        width: 620px;
        height: 1388px;
        border-radius: 48px;
        overflow: hidden;
        background: #f4efe4;
      }
      .sb {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 46px;
        padding: 0 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 22px;
        color: #2B2420;
        background: #f4efe4;
        z-index: 5;
      }
      .sb-icons {
        display: flex;
        gap: 6px;
        align-items: flex-end;
      }
      .sb-bar {
        display: block;
        width: 6px;
        border-radius: 2px;
        background: currentColor;
      }
      .sb-batt {
        display: block;
        width: 36px;
        height: 18px;
        margin-left: 6px;
        border-radius: 5px;
        border: 3px solid currentColor;
        position: relative;
      }
      .sb-batt::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        bottom: 2px;
        width: 20px;
        border-radius: 2px;
        background: currentColor;
      }
      .shot {
        position: absolute;
        left: 0;
        top: 46px;
        width: 620px;
        height: 1342px;
        display: block;
      }
      .shot.cover {
        object-fit: cover;
        object-position: center top;
      }
      .hl {
        position: absolute;
        border: 5px solid #A35A1F;
        border-radius: 18px;
        background: rgba(163, 90, 31, 0.1);
        opacity: 0;
        z-index: 7;
      }
      .tap {
        position: absolute;
        width: 92px;
        height: 92px;
        z-index: 9;
        opacity: 0;
      }
      .tap-dot {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(163, 90, 31, 0.35);
        border: 5px solid #A35A1F;
      }
      .tap-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid #A35A1F;
        opacity: 0;
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgba(43, 36, 32, 0.32);
        opacity: 0;
        z-index: 6;
      }
      /* chat (WhatsApp-style, brand colours) */
      .chat-head {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 150px;
        padding: 46px 28px 0;
        background: #0D3B45;
        color: #F6F1E6;
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 6;
      }
      .avatar {
        flex: 0 0 auto;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 32px;
        background: #e4ece8;
        color: #0D3B45;
      }
      .chat-title {
        font-weight: 600;
        font-size: 34px;
        line-height: 1.1;
      }
      .chat-sub {
        font-weight: 400;
        font-size: 24px;
        color: #e4ece8;
      }
      .chat-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        bottom: 0;
        background: #e4ece8;
        background-image: radial-gradient(rgba(13, 59, 69, 0.08) 2px, transparent 2.5px);
        background-size: 34px 34px;
        padding: 26px 22px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .bubble {
        max-width: 90%;
        padding: 18px 22px 12px;
        border-radius: 20px;
        background: #fffdf9;
        color: #2B2420;
        line-height: 1.3;
        box-shadow: 0 3px 0 rgba(13, 59, 69, 0.08);
      }
      .bubble.out {
        align-self: flex-end;
        background: #dce6e4;
        border-top-right-radius: 6px;
      }
      .bubble .time {
        display: block;
        text-align: right;
        font-size: 21px;
        color: rgba(43, 36, 32, 0.6);
        margin-top: 6px;
      }
      .day-chip {
        align-self: center;
        padding: 8px 22px;
        border-radius: 14px;
        background: #fffdf9;
        color: rgba(43, 36, 32, 0.72);
        font-size: 23px;
        font-weight: 600;
      }
      /* notification cards */
      .ntf {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 64px;
        padding: 22px 22px 24px;
        border-radius: 26px;
        background: #fffdf9;
        box-shadow: 0 18px 40px rgba(43, 36, 32, 0.32);
        display: flex;
        gap: 18px;
        align-items: flex-start;
        z-index: 8;
        opacity: 0;
      }
      .ntf-ic {
        flex: 0 0 auto;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #0D3B45;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ntf-b {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ntf-h {
        display: flex;
        justify-content: space-between;
        font-size: 24px;
        color: rgba(43, 36, 32, 0.72);
      }
      .ntf-h b {
        color: #2B2420;
        font-weight: 600;
      }
      .ntf-t {
        font-size: 30px;
        line-height: 1.32;
        color: #2B2420;
      }
      .mk {
        position: relative;
        display: inline-block;
        font-weight: 600;
        color: #0D3B45;
      }
      .mk-bar {
        position: absolute;
        left: -4px;
        right: -4px;
        bottom: 2px;
        height: 16px;
        border-radius: 5px;
        background: rgba(163, 90, 31, 0.42);
        transform-origin: left center;
      }
      .mk-t {
        position: relative;
      }
    
      .scr { isolation: isolate; }
      .eyebrow { position: absolute; left: 60px; top: 150px; display: inline-flex; align-items: center; gap: 16px; padding: 10px 26px 10px 10px; border-radius: 999px; background: #0D3B45; color: #F6F1E6; font-weight: 600; font-size: 32px; opacity: 0; }
      .eb-n { display: inline-flex; width: 52px; height: 52px; border-radius: 50%; align-items: center; justify-content: center; background: #F6F1E6; color: #0D3B45; font-size: 30px; }

      .ticks { color: #0D3B45; font-size: 19px; }
      .chat-head { background: #0D3B45; }
      .chat-sb { position: absolute; left: 38px; top: 10px; font-weight: 600; font-size: 22px; color: #F6F1E6; }
      .avatar { background: #0D3B45; border: 3px solid rgba(246, 241, 230, 0.6); }
      .avatar img { width: 46px; height: 46px; display: block; }
      .chat-body { background-color: #ece5d6; background-image: radial-gradient(rgba(13, 59, 69, 0.07) 2px, transparent 2.5px); }
      .chat-col { display: flex; flex-direction: column; gap: 16px; }
      .bubble { font-size: 27px; color: #2B2420; }
      .bubble b { font-weight: 600; }
      .bubble.out { font-weight: 400; font-size: 30px; }
      .card { position: absolute; left: 26px; right: 26px; padding: 34px 32px; border-radius: 28px; background: #0D3B45; color: #F6F1E6; display: flex; gap: 22px; align-items: flex-start; box-shadow: 0 22px 50px rgba(43, 36, 32, 0.35); z-index: 9; opacity: 0; }
      .card-ic { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%; background: #F6F1E6; color: #0D3B45; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 40px; }
      .card-t { font-size: 40px; line-height: 1.3; font-weight: 500; }
      .card-t b { font-weight: 600; }
      .addr { position: absolute; left: 0; right: 0; top: 46px; height: 60px; padding: 0 18px; display: flex; align-items: center; background: #ece6d8; border-bottom: 2px solid rgba(43, 36, 32, 0.08); z-index: 4; }
      .addr-pill { display: block; width: 100%; padding: 9px 20px; border-radius: 999px; background: #fffdf9; font-weight: 500; font-size: 23px; color: #2B2420; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .addr-pill b { font-weight: 600; color: #0D3B45; }
      .eyebrow:not(:has(.eb-n)) { padding-left: 26px; }
      .bubble img.ph { display: block; border-radius: 14px; margin: -6px -8px 12px; object-fit: cover; }
      .avatar { font-weight: 600; font-size: 34px; color: #F6F1E6; }
