<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Reel cama plegable v2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Reel «Súper Prosko» (14-oct). Lo escribe montaje.mjs: no editar a mano. Encima de la base limpia (cámara
         de ffmpeg) van los punch-in, un destello crema suave en los cortes y los PNG de textos y logo. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d3b45; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0d3b45; }
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; will-change: transform; }
      #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #destello { position: absolute; inset: 0; background: #f6f1e6; opacity: 0; pointer-events: none; }
      .capa { position: absolute; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.2667" data-width="1080" data-height="1920">
      <!-- el tiempo va en el video, no en el envoltorio #cam -->
      <div id="cam">
        <video id="base" class="clip" src="assets/base.mp4" muted playsinline data-start="0" data-duration="14.2667" data-track-index="0"></video>
      </div>
      <div id="destello"></div>
      <img id="gancho" class="clip capa" src="assets/gancho.png" style="top:713px; left:0px" data-start="0" data-duration="1.5" data-track-index="1" />
      <img id="etiqueta" class="clip capa" src="assets/etiqueta.png" style="top:1060px; left:0px" data-start="1.5" data-duration="1.5" data-track-index="2" />
      <img id="frase" class="clip capa" src="assets/frase.png" style="top:369px; left:0px" data-start="5.95" data-duration="1.6" data-track-index="2" />
      <img id="sub-01" class="clip capa" src="assets/sub-01.png" style="top:1186px; left:0px" data-start="1.59" data-duration="0.86" data-track-index="3" />
      <img id="sub-02" class="clip capa" src="assets/sub-02.png" style="top:1186px; left:0px" data-start="2.45" data-duration="1.7" data-track-index="3" />
      <img id="sub-03" class="clip capa" src="assets/sub-03.png" style="top:1358px; left:0px" data-start="4.6067" data-duration="1.31" data-track-index="3" />
      <img id="sub-04" class="clip capa" src="assets/sub-04.png" style="top:1246px; left:0px" data-start="12.433" data-duration="0.86" data-track-index="3" />
      <img id="sub-05" class="clip capa" src="assets/sub-05.png" style="top:1246px; left:0px" data-start="13.293" data-duration="0.96" data-track-index="3" />
      <img id="logo" class="clip capa" src="assets/logo.png" style="top:1425px; left:350px" data-start="12.7667" data-duration="1.5" data-track-index="4" />
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#cam", { scale: 1, transformOrigin: "540px 960px" }, 0);
      tl.set("#cam", { transformOrigin: "540px 560px" }, 0.54);
      tl.to("#cam", { scale: 1.22, duration: 0.13, ease: "power3.out" }, 0.55);
      tl.to("#cam", { scale: 1, duration: 0.04, ease: "none" }, 1.46);
      tl.set("#cam", { transformOrigin: "300px 520px" }, 2.44);
      tl.to("#cam", { scale: 1.18, duration: 0.13, ease: "power3.out" }, 2.45);
      tl.to("#cam", { scale: 1, duration: 0.04, ease: "none" }, 4.1267);
      for (const [t, pico] of [[1.5,0.2],[4.1667,0.2],[5.9333,0.2],[7.9,0.2],[8.8,0.32],[10.6333,0.2],[12,0.2]]) {
        tl.set("#destello", { opacity: pico }, t);
        tl.to("#destello", { opacity: 0, duration: 0.2, ease: "power1.out" }, t + 0.001);
      }
      tl.set("#destello", { opacity: 0 }, 14.2567);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
