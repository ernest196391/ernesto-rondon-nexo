        <div class="sub" id="sub-13"><span class="sub-cap">El que pierde es <span class="sk">el que recibe el billete</span>.</span></div>

        <div class="sub" id="sub-23"><span class="sub-cap">Si sale rojo, lo devuelves con calma</span></div>
