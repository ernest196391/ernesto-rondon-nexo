        border-radius: 5px;
        border: 3px solid currentColor;

      .sb-batt::after {
        content: "";

        top: 2px;
        bottom: 2px;
        width: 20px;

        background: currentColor;

      .shot {
        position: absolute;

      .hl {
        position: absolute;

        background: rgba(163, 90, 31, 0.1);

      .tap {
        position: absolute;

        inset: 0;

        background: rgba(163, 90, 31, 0.35);
        border: 5px solid #A35A1F;
      }
      .tap-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid #A35A1F;
        opacity: 0;
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgba(43, 36, 32, 0.32);
        opacity: 0;
        z-index: 6;
      }
      /* chat (WhatsApp-style, brand colours) */
      .chat-head {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 150px;
        padding: 46px 28px 0;

        color: #F6F1E6;
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 6;

      .avatar {

        height: 76px;

        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 32px;
        background: #e4ece8;
        color: #0D3B45;

      .chat-title {
        font-weight: 600;
        font-size: 34px;

      }
      .chat-sub {
        font-weight: 400;
        font-size: 24px;
        color: #e4ece8;
      }
      .chat-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        bottom: 0;
        background: #e4ece8;

        display: flex;
        flex-direction: column;
        gap: 18px;

      .bubble {

        text-align: right;
        font-size: 21px;

      }
      .day-chip {
        align-self: center;

        color: rgba(43, 36, 32, 0.72);
