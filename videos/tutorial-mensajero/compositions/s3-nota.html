<!doctype html>
<html lang="es">
  <head>

  </head>
  <body>
    <template>
      <style>

        }

          font-size: 44px;

        }

          position: absolute;

          border-radius: 14px;

          border: 3px solid rgba(15, 61, 58, 0.14);

        #s3-thumb {
          width: 104px;
          height: 104px;

        #s3-pprice {

        }
        .s3-label {
          position: absolute;
          left: 34px;
          font-weight: 700;
          font-size: 30px;
          color: #0f3d3a;
        }
        .s3-input {
          position: absolute;
          left: 28px;
          right: 28px;
          height: 92px;
          border-radius: 14px;
          border: 3px solid rgba(15, 61, 58, 0.25);
          background: #f6f1e6;
          padding: 0 26px;
          display: flex;
          align-items: center;
          font-weight: 600;
          font-size: 34px;
          color: #25231f;
        }
        #s3-note {
          position: absolute;
          left: 28px;
          right: 28px;
          top: 770px;
          height: 210px;
          border-radius: 14px;
          border: 3px solid rgba(15, 61, 58, 0.25);
          background: #f6f1e6;
        }
        #s3-note-focus {
          position: absolute;
          inset: -3px;
          border-radius: 14px;
          border: 6px solid #0f3d3a;
          box-shadow: 0 0 0 10px rgba(195, 148, 67, 0.35);
          background: #fffdf9;
          opacity: 0;
        }
        #s3-note-ph {
          position: absolute;
          left: 26px;
          top: 26px;
          font-weight: 400;
          font-size: 32px;
          color: #6f6a62;
        }
        #s3-typed-line {
          position: absolute;
          left: 26px;
          top: 30px;
          right: 26px;
          display: flex;
          align-items: center;
          height: 64px;
          font-weight: 800;
          font-size: 50px;
          color: #0f3d3a;
        }
        #s3-cursor {
          display: block;
          width: 5px;
          height: 56px;
          margin-left: 6px;
          border-radius: 2px;
          background: #c39443;
          opacity: 0;
        }
        #s3-btn {
          position: absolute;
          left: 28px;
          right: 28px;
          top: 1030px;
          height: 110px;
          border-radius: 14px;
          background: #0f3d3a;
          color: #f6f1e6;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 40px;
        }
      </style>
      <div id="s3-root" data-composition-id="s3-nota" data-width="1080" data-height="1920">
        <div id="s3-wrap" class="scene-wrap">
          <div class="cap" id="s3-c0"><span class="ci">También en la nota del pedido</span></div>
          <div class="cap" id="s3-c1"><span class="ci">Escribe <span class="k">mensajero</span> y su nombre</span></div>

          <div class="phone" id="s3-phone">
            <div class="screen">
              <div class="statusbar on-dark">
                <span>4:13</span>
                <span class="sb-icons"
                  ><span class="sb-bar" style="height: 10px"></span><span class="sb-bar" style="height: 15px"></span
                  ><span class="sb-bar" style="height: 20px"></span><span class="sb-batt"></span
                ></span>
              </div>
              <div id="s3-header">
                <div id="s3-back">‹</div>
                <div id="s3-htitle">Finalizar pedido</div>
              </div>
              <div id="s3-prod">
                <div id="s3-thumb">🛏️</div>
                <div>
                  <div id="s3-pname">Cama plegable</div>
                  <div id="s3-pprice">60 USD + 2.300 CUP</div>
                </div>
              </div>
              <div class="s3-label" style="top: 386px">Nombre del cliente</div>
              <div class="s3-input" style="top: 430px">Duniel</div>
              <div class="s3-label" style="top: 556px">Dirección</div>
              <div class="s3-input" style="top: 600px">Alturas de La Lisa</div>
              <div class="s3-label" id="s3-note-label" style="top: 726px">Nota del pedido</div>
              <div id="s3-note">
                <div id="s3-note-focus"></div>
                <div id="s3-note-ph">Escribe una nota…</div>
                <div id="s3-typed-line"><span id="s3-typed"></span><span id="s3-cursor"></span></div>
              </div>
              <div id="s3-btn">Enviar pedido</div>
              <div class="tap" id="s3-tap"><div class="tap-ring" id="s3-ring"></div><div class="tap-dot" id="s3-dot"></div></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s3-c0", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.12);
          tl.fromTo("#s3-c0", { opacity: 1, y: 0 }, { opacity: 0, y: -26, duration: 0.22, ease: "power2.in", immediateRender: false }, 2.3);
          tl.fromTo("#s3-c1", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.52);

          tl.fromTo("#s3-phone", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);

          // tap the note field (screen centre ~ 372, 875)
          tl.fromTo("#s3-tap", { opacity: 0, scale: 1.4, x: 320, y: 823 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.15);
          tl.fromTo("#s3-dot", { scale: 1 }, { scale: 0.78, duration: 0.1, ease: "power1.in" }, 1.5);
          tl.fromTo("#s3-dot", { scale: 0.78 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 1.6);
          tl.fromTo("#s3-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.1, duration: 0.5, ease: "power2.out" }, 1.58);
          tl.fromTo("#s3-note-focus", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.62);
          tl.fromTo("#s3-tap", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, 1.95);
          tl.fromTo("#s3-note-ph", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, 1.7);
          tl.fromTo("#s3-cursor", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 1.75);
          // cursor blink before typing (finite)
          tl.fromTo("#s3-cursor", { opacity: 1 }, { opacity: 0.15, duration: 0.2, ease: "steps(1)", yoyo: true, repeat: 3, immediateRender: false }, 1.85);

          // typing "mensajero: Pedri" — stepped, a pure function of tween progress
          const full = "mensajero: Pedri";
          const typedEl = document.getElementById("s3-typed");
          const proxy = { n: 0 };
          tl.fromTo(
            proxy,
            { n: 0 },
            {
              n: full.length,
              duration: 1.45,
              ease: "none",
              onUpdate: () => {
                typedEl.textContent = full.slice(0, Math.floor(proxy.n + 0.0001));
              },
            },
            2.6
          );
          tl.fromTo("#s3-typed-line", { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out", transformOrigin: "left center" }, 4.1);
          tl.fromTo("#s3-typed-line", { scale: 1.06 }, { scale: 1, duration: 0.25, ease: "power2.inOut", immediateRender: false, transformOrigin: "left center" }, 4.28);

          tl.fromTo("#s3-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 4.4);
          window.__timelines["s3-nota"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
