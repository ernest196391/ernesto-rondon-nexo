<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s5-root {
          position: absolute;
          inset: 0;
        }
        #s5-old {
          font-size: 32px;
        }
        #s5-msg {
          font-size: 42px;
          line-height: 1.32;
          padding: 26px 30px 16px;
          max-width: 94%;
          box-shadow: 0 10px 30px rgba(15, 61, 58, 0.16);
        }
        .s5-hl {
          position: relative;
          display: inline-block;
          font-weight: 800;
          color: #0f3d3a;
        }
        .s5-mark {
          position: absolute;
          left: -6px;
          right: -6px;
          bottom: 4px;
          height: 22px;
          border-radius: 6px;
          background: rgba(195, 148, 67, 0.5);
          transform-origin: left center;
        }
        .s5-hl span {
          position: relative;
        }
        #s5-compose {
          position: absolute;
          left: 22px;
          right: 22px;
          bottom: 26px;
          height: 96px;
          display: flex;
          align-items: center;
          gap: 16px;
          z-index: 4;
        }
        #s5-compose-field {
          flex: 1;
          height: 96px;
          border-radius: 48px;
          background: #fffdf9;
          display: flex;
          align-items: center;
          padding: 0 34px;
          font-size: 32px;
          color: #6f6a62;
        }
        #s5-compose-send {
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: #0f3d3a;
          color: #f6f1e6;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 40px;
          font-weight: 800;
        }
        #s5-notif {
          position: absolute;
          left: 22px;
          right: 22px;
          top: 66px;
          height: 120px;
          border-radius: 26px;
          background: #fffdf9;
          box-shadow: 0 16px 36px rgba(37, 35, 31, 0.28);
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 0 22px;
          z-index: 8;
          opacity: 0;
        }
        #s5-notif-ic {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          background: #0f3d3a;
          color: #f6f1e6;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 30px;
        }
        #s5-notif-t {
          font-weight: 800;
          font-size: 30px;
          color: #25231f;
        }
        #s5-notif-s {
          font-weight: 400;
          font-size: 26px;
          color: #6f6a62;
        }
      </style>
      <div id="s5-root" data-composition-id="s5-aviso" data-width="1080" data-height="1920">
        <div id="s5-wrap" class="scene-wrap">

                <span>4:15</span>
                <span class="sb-icons"
                  ><span class="sb-bar" style="height: 10px"></span><span class="sb-bar" style="height: 15px"></span
                  ><span class="sb-bar" style="height: 20px"></span><span class="sb-batt"></span
                ></span>
              </div>
              <div class="chat-head">
                <div class="avatar">CV</div>
                <div>
                  <div class="chat-title">Casa Viva</div>
                  <div class="chat-sub">Tu WhatsApp · Dayami</div>
                </div>
              </div>
              <div class="chat-body">
                <div class="day-chip">Hoy</div>
                <div class="bubble out" id="s5-old">Pedido #2896 · Cama plegable<span class="time">4:12 ✓✓</span></div>
                <div class="bubble in" id="s5-msg">
                  🛵 Tu pedido #2896 lo lleva
                  <span class="s5-hl" id="s5-hl1"><i class="s5-mark" id="s5-m1"></i><span>Pedri</span></span>,

                  cliente.<span class="time">4:15</span>
                </div>
              </div>
              <div id="s5-compose"><div id="s5-compose-field">Mensaje</div><div id="s5-compose-send">➤</div></div>
              <div id="s5-notif" data-layout-allow-overlap data-layout-allow-occlusion>
                <div id="s5-notif-ic" data-layout-allow-overlap>CV</div>
                <div>
                  <div id="s5-notif-t" data-layout-allow-overlap>Casa Viva</div>

              </div>
            </div>
          </div>

      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s5-c0", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.1);
          tl.fromTo("#s5-phone", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
          // push notification drops in, then the bubble lands
          tl.fromTo("#s5-notif", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.35);
          tl.fromTo("#s5-notif", { opacity: 1, y: 0 }, { opacity: 0, y: -60, duration: 0.3, ease: "power2.in", immediateRender: false }, 1.15);
          tl.fromTo("#s5-msg", { opacity: 0, scale: 0.6, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", transformOrigin: "top left" }, 0.7);
          // marker highlights on "Pedri" (quién) and "hoy 4 pm" (a qué hora)
          tl.fromTo("#s5-m1", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.75);
          tl.fromTo("#s5-m2", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.7);
          tl.fromTo("#s5-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 3.5);
          window.__timelines["s5-aviso"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
