      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const capIn = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
          const capOut = (sel, t) =>
            tl.fromTo(sel, { opacity: 1, y: 0 }, { opacity: 0, y: -26, duration: 0.22, ease: "power2.in", immediateRender: false }, t);
          const caps = [
            ["#s2-c0", 0.1, 1.45],
            ["#s2-c1", 1.45, 2.3],
            ["#s2-c2", 2.3, 3.3],
            ["#s2-c3", 3.3, 4.75],
            ["#s2-c4", 4.75, 6.0],
            ["#s2-c5", 6.0, 9.2],
            ["#s2-c6", 9.2, null],
          ];
          caps.forEach(([sel, a, b]) => {
            capIn(sel, a + (a > 0.1 ? 0.12 : 0));
            if (b !== null) capOut(sel, b - 0.1);
          });

          // phone enters
          tl.fromTo("#s2-phone", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0);

          // tap helper: centre of a 104px marker on (cx, cy) screen coords
          const P = (cx, cy) => ({ x: cx - 52, y: cy - 52 });
          const press = (t) => {
            tl.fromTo("#s2-dot", { scale: 1 }, { scale: 0.78, duration: 0.1, ease: "power1.in" }, t);
            tl.fromTo("#s2-dot", { scale: 0.78 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.1);
            tl.fromTo("#s2-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.1, duration: 0.5, ease: "power2.out" }, t + 0.08);
          };

          // 1) tap the burger
          tl.fromTo("#s2-tap", { opacity: 0, scale: 1.4, ...P(68, 112) }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.25);
          press(1.6);
          // drawer opens
          tl.fromTo("#s2-scrim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.72);
          tl.fromTo("#s2-drawer", { x: -600 }, { x: 0, duration: 0.42, ease: "power3.out" }, 1.72);
          tl.fromTo("#s2-ht-home", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 1.72);

          // 2) move to Ventas and tap
          tl.fromTo("#s2-tap", P(68, 112), { ...P(230, 732), duration: 0.38, ease: "power2.inOut", immediateRender: false }, 2.05);
          tl.fromTo("#s2-item-ventas-hl", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.42);
          press(2.48);
          // drawer closes, Ventas view in
          tl.fromTo("#s2-tap", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 2.75);
          tl.fromTo("#s2-drawer", { x: 0 }, { x: -600, duration: 0.35, ease: "power2.in", immediateRender: false }, 2.8);
          tl.fromTo("#s2-scrim", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, 2.85);
          tl.fromTo("#s2-home", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 2.95);
          tl.fromTo("#s2-ht-ventas", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.05);
          tl.fromTo("#s2-ventas", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.05);
          // order card pulse ("En tu pedido")
          tl.fromTo("#s2-order", { scale: 1 }, { scale: 1.035, duration: 0.25, ease: "power2.out" }, 3.45);
          tl.fromTo("#s2-order", { scale: 1.035 }, { scale: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 3.7);

          // 3) tap the select (screen centre ~ 372, 448)
          tl.fromTo("#s2-tap", { opacity: 0, scale: 1.4, ...P(372, 448) }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.6);
          press(4.92);
          tl.fromTo("#s2-dd", { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1, duration: 0.32, ease: "power3.out" }, 5.02);

          // 4) choose Pedri (option centre ~ 300, 644)
          tl.fromTo("#s2-tap", P(372, 448), { ...P(300, 644), duration: 0.4, ease: "power2.inOut", immediateRender: false }, 6.1);
          tl.fromTo("#s2-opt-pedri-hl", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.5);
          press(6.85);
          tl.fromTo("#s2-dd", { opacity: 1, scaleY: 1 }, { opacity: 0, scaleY: 0.7, duration: 0.25, ease: "power2.in", immediateRender: false }, 7.05);
          tl.fromTo("#s2-val-any", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, 7.12);
          tl.fromTo("#s2-select-on", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 7.15);
          tl.fromTo("#s2-val-pedri", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 7.18);
          tl.fromTo("#s2-tap", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, 7.5);

          // 5) toast "Guardado"
          tl.fromTo("#s2-toast", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 9.25);
          tl.fromTo("#s2-toast-check", { rotation: -90, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 9.4);

          // exit
          tl.fromTo("#s2-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 10.7);
          window.__timelines["s2-app"] = tl;
        })();
      </script>
