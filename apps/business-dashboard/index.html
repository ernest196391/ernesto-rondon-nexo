<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO Negocio</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--muted:#475569;--line:#e5e7eb;--ok:#14532d;--bad:#7f1d1d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#111c33;--ink:#e5e7eb;--muted:#94a3b8;--line:#1f2a44;--ok:#86efac;--bad:#fca5a5;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:24px 16px}header small{font-weight:700;letter-spacing:.08em;color:var(--muted)}h1{margin:.25rem 0 1rem}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0}
label{display:grid;gap:6px;font-weight:700;margin:10px 0}
input,select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
button{font:inherit;min-height:46px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 16px;cursor:pointer}
button.link{background:transparent;color:var(--muted);min-height:36px;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}.msg{padding:10px 12px;border-radius:12px;margin:10px 0}.msg[data-tone=ok]{color:var(--ok)}.msg[data-tone=bad]{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}.kpi strong{display:block;font-size:1.25rem;margin-top:4px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
ul{padding-left:18px}
</style>
</head>
<body>
<main>
  <header><small>NEXO BUSINESS</small><h1>Resumen del negocio</h1></header>

  <section class="card" id="auth">
    <form id="login">
      <label>Correo<input name="email" type="email" autocomplete="email" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <div class="row">
        <button type="submit">Entrar</button>
        <button type="button" class="link" id="signup">Crear cuenta</button>
      </div>
    </form>
    <div class="msg" id="auth-msg" role="status"></div>
  </section>

  <section id="app" hidden>
    <div class="row card">
      <span class="muted" id="who"></span>
      <div class="row">
        <select id="days" aria-label="Periodo"><option value="7">7 días</option><option value="30">30 días</option><option value="90">90 días</option></select>
        <button type="button" id="refresh">Actualizar</button>
        <button type="button" class="link" id="logout">Salir</button>
      </div>
    </div>
    <div id="content"></div>
  </section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// Publishable key: safe in the browser. Data access is enforced in the database
// (only members of a business can read its summary).
const supabase = createClient(
  "https://viwwlriwlwodrfukbgbj.supabase.co",
  "sb_publishable_1NdUSjDeoYWTMgu2MYOfeg_1K0G241x",
);

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (minor, currency) =>
  `${(minor / 100).toLocaleString("es", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${esc(currency)}`;
const say = (text, tone = "") => { const m = $("#auth-msg"); m.textContent = text; m.dataset.tone = tone; };

function render(summary) {
  const businesses = summary.businesses ?? [];
  if (!businesses.length) {
    $("#content").innerHTML = `<div class="card"><p>Tu cuenta todavía no tiene acceso a ningún negocio.</p><p class="muted">Pide a NEXO que la vincule a tu negocio; después pulsa Actualizar.</p></div>`;
    return;
  }
  $("#content").innerHTML = businesses.map(b => {
    const period = b.days.reduce((acc, d) => {
      acc[d.currency] ??= { count: 0, minor: 0, refunds: 0 };
      acc[d.currency].count += d.salesCount; acc[d.currency].minor += d.salesMinor; acc[d.currency].refunds += d.refundsMinor;
      return acc;
    }, {});
    const kpis = Object.entries(period).map(([c, v]) =>
      `<div class="kpi"><span class="muted">Ventas del periodo · ${esc(c)}</span><strong>${money(v.minor, c)}</strong><span class="muted">${v.count} ventas · devuelto ${money(v.refunds, c)}</span></div>`).join("")
      || `<div class="kpi"><span class="muted">Ventas del periodo</span><strong>Sin ventas</strong></div>`;
    const list = (items, fn) => items.length ? items.map(fn).join(" · ") : "nada";
    return `<section class="card">
      <div class="row"><h2>${esc(b.businessId)}</h2><span class="muted">desde ${esc(b.since)}</span></div>
      <div class="kpis">${kpis}</div>
      <div class="wrap"><table>
        <thead><tr><th>Día</th><th>Ventas</th><th>Importe</th><th>Devuelto</th></tr></thead>
        <tbody>${b.days.map(d => `<tr><td>${esc(d.day)}</td><td>${d.salesCount}</td><td>${money(d.salesMinor, d.currency)}</td><td>${money(d.refundsMinor, d.currency)}</td></tr>`).join("") || `<tr><td colspan="4">Sin ventas en el periodo</td></tr>`}</tbody>
      </table></div>
      <p><strong>Total histórico:</strong> ${list(b.totals, t => `${t.salesCount} ventas · ${money(t.salesMinor, t.currency)}`)}</p>
      <p><strong>Fiado pendiente:</strong> ${list(b.receivables, r => `${money(r.balanceMinor, r.currency)} (${r.openCount})`)}</p>
      <p><strong>Efectivo en manos de mensajeros:</strong> ${list(b.messengerCash, m => money(m.outstandingMinor, m.currency))}</p>
      <h3>Stock</h3>
      ${(b.stock ?? []).some(p => p.low) ? `<p class="msg" data-tone="bad">Stock bajo: ${b.stock.filter(p => p.low).map(p => esc(p.name)).join(", ")}</p>` : ""}
      <div class="wrap"><table>
        <thead><tr><th>Producto</th><th>Stock</th><th>Mínimo</th></tr></thead>
        <tbody>${(b.stock ?? []).map(p => `<tr><td>${p.low ? "⚠ " : ""}${esc(p.name)}</td><td>${p.quantity}</td><td>${p.minStock ?? "—"}</td></tr>`).join("") || `<tr><td colspan="3">Sin productos</td></tr>`}</tbody>
      </table></div>
      ${(b.stock ?? []).some(p => p.quantity < 0) ? `<p class="muted">Un stock negativo significa que aún no se ha hecho el conteo inicial de ese producto: haz un conteo en el POS (Ubicaciones e inventario) para fijar la cantidad real.</p>` : ""}
      <h3>Equipos</h3>
      <ul>${b.devices.map(d => `<li>${esc(d.label ?? d.deviceId)} · ${d.events} registros · última conexión ${d.lastSeenAt ? esc(new Date(d.lastSeenAt).toLocaleString("es")) : "nunca"}${d.active === false ? " · <strong>desactivado</strong>" : ""}</li>`).join("")}</ul>
      <p class="muted">Datos sincronizados hasta ${esc(new Date(b.generatedAt).toLocaleString("es"))}. Un equipo sin conexión sube sus ventas al recuperarla.</p>
    </section>
    ${b.role === "owner" ? `<section class="card" data-catalog="${esc(b.businessId)}"><h2>Catálogo y precios</h2><p class="muted">Cargando…</p></section>` : ""}
    ${b.role === "owner" ? devicesSection(b) : ""}`;
  }).join("");
  document.querySelectorAll("[data-catalog]").forEach(el => void loadCatalog(el));
  document.querySelectorAll("[data-devices]").forEach(wireDevices);
}

// ---------- Devices (owners) ----------

function devicesSection(b) {
  return `<section class="card" data-devices="${esc(b.businessId)}">
    <h2>Equipos del negocio</h2>
    <ul>${b.devices.map(d => `<li>${esc(d.label ?? d.deviceId)} <span class="muted">(${esc(d.deviceId)})</span> · ${d.active === false ? "desactivado" : "activo"}
      <button type="button" class="link" data-toggle="${esc(d.deviceId)}" data-active="${d.active === false ? "true" : "false"}">${d.active === false ? "Reactivar" : "Desactivar"}</button></li>`).join("")}</ul>
    <form data-new-device>
      <h3>Añadir equipo</h3>
      <label>Nombre<input name="label" required placeholder="Móvil de la tienda"></label>
      <label>Identificador<input name="device" required pattern="[a-z0-9][a-z0-9-]{2,62}" placeholder="movil-tienda-02"></label>
      <button type="submit">Crear y ver la clave</button>
    </form>
    <div class="msg" data-device-msg role="status"></div>
    <p class="muted">Desactiva un equipo si se pierde o lo roban: deja de poder sincronizar al instante.</p>
  </section>`;
}

function wireDevices(el) {
  const business = el.dataset.devices;
  const msg = el.querySelector("[data-device-msg]");
  el.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.onclick = async () => {
      const active = btn.dataset.active === "true";
      if (!active && !confirm("¿Desactivar este equipo? Dejará de sincronizar hasta que lo reactives.")) return;
      const { data, error } = await supabase.rpc("nexo_business_set_device_active", { p_business: business, p_device_id: btn.dataset.toggle, p_active: active });
      if (error || data?.error) { msg.textContent = `No se pudo: ${error?.message ?? data.error}`; msg.dataset.tone = "bad"; return; }
      await load();
    };
  });
  el.querySelector("[data-new-device]").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { data, error } = await supabase.rpc("nexo_business_create_device", { p_business: business, p_device_id: f.get("device"), p_label: f.get("label") });
    if (error || data?.error) { msg.textContent = `No se creó: ${error?.message ?? data.error}`; msg.dataset.tone = "bad"; return; }
    msg.dataset.tone = "ok";
    msg.innerHTML = `Equipo <strong>${esc(data.deviceId)}</strong> creado. Copia esta clave en el POS (Operaciones → Sincronización → Clave del dispositivo). <strong>Solo se muestra ahora.</strong><br><code style="word-break:break-all">${esc(data.token)}</code>`;
    e.target.reset();
  };
}

// ---------- Catalog editor (owners) ----------

const CURRENCIES = ["USD", "CUP", "MLC"];
// Message to show once the catalog section finishes re-rendering.
const pendingCatalogMsg = {};
const toMinor = raw => {
  const v = Number(String(raw).replace(",", ".").trim());
  return Number.isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
};

const SOURCE_LABELS = { biznecubano: "BizneCubano (la web aporta las variantes)", woocommerce: "Web de la tienda (casavivadecuba.com)" };

async function renderSource(el, business) {
  const box = el.querySelector("[data-source]");
  const { data, error } = await supabase.rpc("nexo_business_get_catalog_source", { p_business: business });
  if (error || !data || data.error) { box.textContent = "Sin fuente de catálogo configurada."; return; }
  const last = data.lastImportResult;
  box.innerHTML = `<label>Fuente del catálogo<select data-kind>${Object.entries(SOURCE_LABELS).map(([k, l]) => `<option value="${k}"${k === data.kind ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
    <label><span><input type="checkbox" data-auto ${data.autoImport ? "checked" : ""} style="width:auto"> Importar automáticamente cada hora</span></label>
    <p class="muted">Última importación: ${data.lastImportAt ? esc(new Date(data.lastImportAt).toLocaleString("es")) : "nunca"}${last ? (last.error ? ` · error: ${esc(last.detail ?? last.error)}` : ` · ${last.items} artículos, ${last.catalogChanges} cambios, ${last.stockCounts} existencias${last.snapshotAt ? ` · instantánea BizneCubano del ${esc(new Date(last.snapshotAt).toLocaleString("es"))}` : ""}${last.websiteUnavailable ? " · la web no respondía: se usó la copia de NEXO para las variantes" : ""}`) : ""}</p>`;
  const save = async () => {
    const { data: r, error: e } = await supabase.rpc("nexo_business_set_catalog_source", {
      p_business: business, p_kind: box.querySelector("[data-kind]").value, p_auto_import: box.querySelector("[data-auto]").checked,
    });
    const msg = el.querySelector("[data-msg]");
    msg.textContent = e || r?.error ? `No se cambió: ${e?.message ?? r.error}` : "✓ Fuente guardada. Pulsa «Importar desde la web» para aplicarla ya, o espera a la importación automática.";
    msg.dataset.tone = e || r?.error ? "bad" : "ok";
  };
  box.querySelector("[data-kind]").onchange = save;
  box.querySelector("[data-auto]").onchange = save;
}

async function loadCatalog(el) {
  const business = el.dataset.catalog;
  const { data, error } = await supabase.rpc("nexo_business_catalog_list", { p_business: business });
  if (error || data?.error) {
    el.innerHTML = `<h2>Catálogo y precios</h2><p>No se pudo cargar: ${esc(error?.message ?? data.error)}</p>`;
    return;
  }
  const products = data;
  const priceCell = (p, c) => (p.prices?.[c] != null ? money(p.prices[c], c) : "—");
  el.innerHTML = `
    <div class="row"><h2>Catálogo y precios</h2><div class="row"><button type="button" data-import>Importar desde la web</button><button type="button" data-new>Nuevo producto</button></div></div>
    <p class="muted">${products.filter(p => p.active).length} productos activos. «Importar desde la web» trae productos, variantes, precios y existencias desde la fuente elegida (solo lectura: no cambia nada ni en BizneCubano ni en la web).</p>
    <p class="muted">Los cambios llegan solos a los equipos en su próxima sincronización (cada minuto con conexión).</p>
    <div data-source class="muted">Cargando fuente del catálogo…</div>
    <div class="wrap"><table>
      <thead><tr><th>Producto</th>${CURRENCIES.map(c => `<th>${c}</th>`).join("")}<th>Estado</th><th></th></tr></thead>
      <tbody>${products.map((p, i) => `<tr><td>${esc(p.name)}<br><span class="muted">${esc(p.sku ?? "")} ${esc((p.barcodes ?? []).join(", "))}</span></td>
        ${CURRENCIES.map(c => `<td>${priceCell(p, c)}</td>`).join("")}
        <td>${p.active ? "Activo" : "Inactivo"}</td><td><button type="button" class="link" data-edit="${i}">Editar</button></td></tr>`).join("")
        || `<tr><td colspan="6">Sin productos</td></tr>`}</tbody>
    </table></div>
    <form data-form hidden></form>
    <div class="msg" data-msg role="status"></div>`;
  const form = el.querySelector("[data-form]");
  const msg = el.querySelector("[data-msg]");
  if (pendingCatalogMsg[business]) {
    msg.textContent = pendingCatalogMsg[business]; msg.dataset.tone = "ok";
    delete pendingCatalogMsg[business];
  }
  const open = p => {
    form.hidden = false;
    form.innerHTML = `
      <h3>${p ? "Editar producto" : "Nuevo producto"}</h3>
      <label>Nombre<input name="name" required value="${esc(p?.name ?? "")}"></label>
      <label>SKU<input name="sku" value="${esc(p?.sku ?? "")}"></label>
      <label>Códigos de barras (separados por coma)<input name="barcodes" value="${esc((p?.barcodes ?? []).join(", "))}"></label>
      ${CURRENCIES.map(c => `<label>Precio ${c}<input name="price-${c}" inputmode="decimal" placeholder="Sin precio" value="${p?.prices?.[c] != null ? (p.prices[c] / 100).toFixed(2) : ""}"></label>`).join("")}
      <label>Stock mínimo (aviso)<input name="min" type="number" min="0" step="1" placeholder="Sin aviso" value="${p?.min_stock ?? ""}"></label>
      <label><span><input type="checkbox" name="active" ${p?.active === false ? "" : "checked"} style="width:auto"> Activo (se vende en el POS)</span></label>
      <div class="row"><button type="submit">Guardar</button><button type="button" class="link" data-cancel>Cancelar</button></div>`;
    form.querySelector("[data-cancel]").onclick = () => { form.hidden = true; };
    form.onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(form);
      const prices = {};
      for (const c of CURRENCIES) {
        const raw = String(f.get(`price-${c}`) ?? "").trim();
        if (!raw) continue;
        const minor = toMinor(raw);
        if (minor == null) { msg.textContent = `Precio ${c} inválido`; msg.dataset.tone = "bad"; return; }
        prices[c] = minor;
      }
      msg.textContent = "Guardando…"; msg.dataset.tone = "";
      const { data: saved, error: saveError } = await supabase.rpc("nexo_business_catalog_upsert", {
        p_business: business,
        p_product_id: p?.product_id ?? crypto.randomUUID(),
        p_name: f.get("name"),
        p_sku: f.get("sku"),
        p_barcodes: String(f.get("barcodes") ?? "").split(",").map(s => s.trim()).filter(Boolean),
        p_prices: prices,
        p_active: f.get("active") === "on",
        p_min_stock: String(f.get("min") ?? "").trim() === "" ? null : Number(f.get("min")),
      });
      if (saveError || saved?.error) {
        msg.textContent = `No se guardó: ${saveError?.message ?? saved.error}`; msg.dataset.tone = "bad";
        return;
      }
      await loadCatalog(el);
      const done = el.querySelector("[data-msg]");
      done.textContent = `✓ Guardado: ${saved.name}`; done.dataset.tone = "ok";
    };
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  el.querySelector("[data-new]").onclick = () => open(null);
  void renderSource(el, business);
  el.querySelector("[data-import]").onclick = async () => {
    const btn = el.querySelector("[data-import]");
    btn.disabled = true; msg.textContent = "Importando desde la web… puede tardar un minuto."; msg.dataset.tone = "";
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const r = await fetch(`https://viwwlriwlwodrfukbgbj.supabase.co/functions/v1/nexo-catalog-import?business=${encodeURIComponent(business)}`, {
        method: "POST", headers: { authorization: `Bearer ${session?.access_token ?? ""}` },
      });
      const out = await r.json();
      if (!r.ok) throw new Error(out.detail ?? out.error ?? `HTTP ${r.status}`);
      pendingCatalogMsg[business] = `✓ Web: ${out.items} artículos, ${out.catalogChanges} cambios de catálogo, ${out.stockCounts} existencias actualizadas, ${out.deactivated} retirados.`;
      await load();
    } catch (e) {
      msg.textContent = `No se pudo importar: ${e.message}`; msg.dataset.tone = "bad"; btn.disabled = false;
    }
  };
  el.querySelectorAll("[data-edit]").forEach(btn => { btn.onclick = () => open(products[Number(btn.dataset.edit)]); });
}

async function load() {
  $("#content").innerHTML = `<div class="card muted">Cargando…</div>`;
  const { data, error } = await supabase.rpc("nexo_business_member_summary", { p_days: Number($("#days").value) });
  if (error || data?.error) {
    $("#content").innerHTML = `<div class="card">No se pudo cargar el resumen: ${esc(error?.message ?? data.error)}</div>`;
    return;
  }
  render(data);
}

let shownUser = null;

async function show(session) {
  const userId = session?.user?.id ?? null;
  // Token refreshes re-fire auth events; only redraw when the user changes,
  // so an open catalog form is never wiped.
  if (userId === shownUser) return;
  shownUser = userId;
  $("#auth").hidden = Boolean(userId);
  $("#app").hidden = !userId;
  if (userId) {
    $("#who").textContent = session.user.email ?? "";
    await load();
  }
}

$("#login").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  say("Entrando…");
  const { error } = await supabase.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
  if (error) say(error.message === "Email not confirmed" ? "Confirma tu correo con el enlace que te enviamos y vuelve a entrar." : "Correo o contraseña incorrectos.", "bad");
};

$("#signup").onclick = async () => {
  const form = $("#login");
  if (!form.reportValidity()) return;
  const f = new FormData(form);
  say("Creando cuenta…");
  const { error } = await supabase.auth.signUp({
    email: f.get("email"),
    password: f.get("password"),
    options: { emailRedirectTo: location.origin + location.pathname },
  });
  say(error ? `No se pudo crear la cuenta: ${error.message}` : "Cuenta creada. Revisa tu correo para confirmarla y después entra.", error ? "bad" : "ok");
};

$("#refresh").onclick = load;
$("#days").onchange = load;
$("#logout").onclick = () => supabase.auth.signOut();

// Fires once on load (INITIAL_SESSION) and on every sign-in/out.
supabase.auth.onAuthStateChange((_event, session) => { void show(session); });
</script>
</body>
</html>
