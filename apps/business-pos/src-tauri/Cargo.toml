[package]
name = "nexo-business-pos"
version = "0.0.1"
description = "NEXO Business offline-first POS"
authors = ["NEXO"]
edition = "2021"

[lib]
name = "nexo_business_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
