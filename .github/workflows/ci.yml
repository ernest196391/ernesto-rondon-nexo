name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: next-15-lockfile
          path: package-lock.json
          retention-days: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
